name: Relay run artifacts

# Throwaway. Downloads another run's artifacts on the runner and prints every
# text file into this job's log, so a session whose network policy cannot reach
# the artifact blob host can still read them. Fires on push to its own branch
# because workflow_dispatch is only registered for the default branch. Not for
# merge.

on:
  push:
    branches:
      - claude/orchestrate-myk9-1345-1351-s8ofq9
    paths:
      - .github/workflows/relay-run-artifacts.yml
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run id whose artifacts to print
        required: false
        default: '39992612026'

permissions:
  contents: read
  actions: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_RUN_ID: ${{ inputs.run_id || '39992612026' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.RELAY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: relay

      - name: Print artifacts
        run: |
          echo "===== RELAY RUN $RELAY_RUN_ID"
          echo '===== FILE TREE'
          find relay -type f -printf '%s %p\n' | sort -k2
          find relay -type f \( -name '*.md' -o -name '*.json' -o -name '*.txt' -o -name '*.csv' -o -name '*.log' \) | sort | while read -r f; do
            echo "===== BEGIN $f"
            cat "$f"
            echo
            echo "===== END $f"
          done
