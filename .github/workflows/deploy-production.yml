name: Deploy Production

# CI-gated production deploy for myK9Show.
#
# Vercel's Git integration must be set NOT to auto-deploy the production branch
# (see docs/operations/ci-vercel-deploys.md). This workflow is then the sole
# path that ships `main` to production — and only AFTER the entire CI workflow
# (Quality Checks + Test + Build + A11y smoke + E2E PR Smoke) passes on the
# merged commit. Before this, every push to `main` deployed to production
# regardless of whether tests passed.
#
# It triggers on the *completion* of the "CI" workflow rather than on `push`
# directly, so it can gate on CI's overall conclusion. It deploys the exact
# commit CI validated (head_sha), not the branch tip.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

# Never run two production deploys at once; let an in-flight deploy finish
# rather than cancelling it mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy myK9Show to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only when CI SUCCEEDED on a push to main (post-merge). Skips PR runs,
    # failed/cancelled CI runs, and any non-main branch.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Deploy the commit CI actually validated, not whatever the branch tip
          # has drifted to since the CI run started.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Remote build: Vercel builds using the project's own settings (Root
      # Directory apps/myk9show, the turbo buildCommand in vercel.json, and the
      # dashboard env vars) — identical to the previous Git auto-deploy, only the
      # trigger changed. Run from the repo root so the whole monorepo is uploaded
      # and the project's Root Directory resolves correctly.
      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "Deployed: $url"
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >>"$GITHUB_STEP_SUMMARY"
