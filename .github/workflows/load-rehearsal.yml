name: Manual G9 Load Rehearsal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type sojmvhhwsjxmfistvzbe to approve remote reseed and load'
        required: true
        type: string
      start_delay_minutes:
        description: 'Preparation window before the synchronized start'
        required: true
        default: '25'
        type: choice
        options:
          - '15'
          - '25'
          - '35'

permissions:
  contents: read

concurrency:
  group: manual-g9-load-rehearsal
  cancel-in-progress: false

env:
  LOAD_TEST_PROJECT_REF: sojmvhhwsjxmfistvzbe
  LOAD_TEST_DB_HOST: aws-1-us-east-2.pooler.supabase.com

jobs:
  prepare:
    name: Approve, preflight, and seed
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: load-rehearsal
    outputs:
      run-id: ${{ steps.window.outputs.run-id }}
      start-at-ms: ${{ steps.window.outputs.start-at-ms }}
      owned-since-us: ${{ steps.ownership.outputs.owned-since-us }}
      restore-required: ${{ steps.restore.outputs.required }}

    steps:
      - name: Confirm the approved target
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "$LOAD_TEST_PROJECT_REF" ]] || {
            echo "Target confirmation did not match the approved project." >&2
            exit 1
          }
          [[ -n "${SUPABASE_DB_PASSWORD:-}" ]] || {
            echo "SUPABASE_DB_PASSWORD is not configured." >&2
            exit 1
          }
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || {
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured." >&2
            exit 1
          }

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify ringside scoring is enabled
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          can_score="$(psql \
            "postgresql://postgres.${LOAD_TEST_PROJECT_REF}@${LOAD_TEST_DB_HOST}:5432/postgres" \
            -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT has_function_privilege('authenticated', 'public.ringside_update_entry(uuid,jsonb,integer)', 'EXECUTE');")"
          [[ "$can_score" == "t" ]] || {
            echo "Ringside scoring is disabled; restore the authenticated RPC grant through a separately approved operator action before rehearsal." >&2
            exit 1
          }

      - name: Verify Supabase CPU/IO telemetry source
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          metrics="$(curl --fail --silent --show-error \
            --user "username:${SUPABASE_SERVICE_ROLE_KEY}" \
            "https://${LOAD_TEST_PROJECT_REF}.supabase.co/customer/v1/privileged/metrics")"
          grep -q 'node_cpu_seconds_total' <<<"$metrics" || {
            echo "Supabase Metrics API did not provide CPU counters." >&2
            exit 1
          }
          grep -q 'node_disk_io_time_seconds_total' <<<"$metrics" || {
            echo "Supabase Metrics API did not provide disk IO counters." >&2
            exit 1
          }

      - name: Mark rehearsal ownership window
        id: ownership
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          owned_since_us="$(psql \
            "postgresql://postgres.${LOAD_TEST_PROJECT_REF}@${LOAD_TEST_DB_HOST}:5432/postgres" \
            -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT floor(extract(epoch FROM clock_timestamp()) * 1000000)::bigint;")"
          [[ "$owned_since_us" =~ ^[0-9]{16,17}$ ]] || {
            echo "Database did not provide a valid rehearsal ownership timestamp." >&2
            exit 1
          }
          echo "owned-since-us=$owned_since_us" >>"$GITHUB_OUTPUT"

      - name: Mark canonical restoration required
        id: restore
        run: echo "required=true" >>"$GITHUB_OUTPUT"

      - name: Clear canonical trial packet snapshots
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @myk9/show exec tsx scripts/load-packet-cleanup.ts

      - name: Canonical reseed
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            "postgresql://postgres.${LOAD_TEST_PROJECT_REF}@${LOAD_TEST_DB_HOST}:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/seed-demo.sql

      - name: Verify canonical postcondition
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Keep this 514/504 contract aligned with src/test/load/loadFixture.ts.
          counts="$(psql \
            "postgresql://postgres.${LOAD_TEST_PROJECT_REF}@${LOAD_TEST_DB_HOST}:5432/postgres" \
            -X -v ON_ERROR_STOP=1 -At -F '|' \
            -c "SELECT count(*), count(*) FILTER (WHERE id::text LIKE 'a1090000-0000-0000-0002-%'), count(*) FILTER (WHERE id::text LIKE 'a1090000-0000-0000-0002-%' AND is_scored) FROM public.entries WHERE show_id = 'dededede-0000-0000-0000-000000000010'::uuid;")"
          [[ "$counts" == "514|504|0" ]] || {
            echo "Canonical fixture postcondition failed: $counts" >&2
            exit 1
          }

      - name: Set synchronized load window
        id: window
        env:
          START_DELAY_MINUTES: ${{ inputs.start_delay_minutes }}
        run: |
          set -euo pipefail
          start_at_ms="$(( ($(date +%s) + START_DELAY_MINUTES * 60) * 1000 ))"
          echo "run-id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"
          echo "start-at-ms=$start_at_ms" >>"$GITHUB_OUTPUT"

  # Samples Supabase from its own runner. Shard 0 used to do this while also
  # driving 12-13 browser contexts, which saturated it (95.3% host CPU p95 while
  # its seven identically-loaded siblings stayed healthy) and then invalidated
  # the very latency attribution the sampling exists to support.
  platform:
    name: Sample platform telemetry
    needs: prepare
    runs-on: ubuntu-latest
    # Covers runner setup, the longest 35-minute barrier, the 10-minute load,
    # and the post-load drain grace.
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Sample Supabase CPU, IO, connections, and statements
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/run-load-platform.ts
        env:
          LOAD_TEST_SUPABASE_PROJECT_REF: sojmvhhwsjxmfistvzbe
          LOAD_TEST_RUN_ID: ${{ needs.prepare.outputs.run-id }}
          LOAD_TEST_START_AT: ${{ needs.prepare.outputs.start-at-ms }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: postgresql://postgres.sojmvhhwsjxmfistvzbe@aws-1-us-east-2.pooler.supabase.com:5432/postgres

      - name: Upload platform observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-platform
          path: apps/myk9show/test-results/load-platform/platform.json
          if-no-files-found: warn
          retention-days: 14

  shard:
    name: Load shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    # Covers runner setup, the longest 35-minute barrier, the 10-minute load,
    # and artifact upload.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install Playwright Chromium
        run: pnpm --filter @myk9/show exec playwright install --with-deps chromium

      - name: Build production bundle for load serving
        working-directory: apps/myk9show
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Run synchronized 12/13-session shard with generator telemetry
        working-directory: apps/myk9show
        run: pnpm test:load:playwright
        env:
          CI: 'true'
          LOAD_TEST_MODE: e2e
          LOAD_TEST_CLOUD_APPROVED: 'true'
          LOAD_TEST_COMPUTE_TIER: Micro
          LOAD_TEST_APPROVED_PROJECT_REFS: sojmvhhwsjxmfistvzbe
          LOAD_TEST_SUPABASE_PROJECT_REF: sojmvhhwsjxmfistvzbe
          LOAD_TEST_START_APP: 'true'
          LOAD_TEST_APP_SERVER: preview
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          LOAD_TEST_SHARD_COUNT: '8'
          LOAD_TEST_SHARD_INDEX: ${{ matrix.shard }}
          LOAD_TEST_RUN_ID: ${{ needs.prepare.outputs.run-id }}
          LOAD_TEST_START_AT: ${{ needs.prepare.outputs.start-at-ms }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: postgresql://postgres.sojmvhhwsjxmfistvzbe@aws-1-us-east-2.pooler.supabase.com:5432/postgres
          E2E_SECRETARY_EMAIL: ${{ secrets.E2E_SECRETARY_EMAIL }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_DEMO_EXHIBITOR_EMAIL: ${{ secrets.E2E_DEMO_EXHIBITOR_EMAIL }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Upload shard observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-shard-${{ matrix.shard }}
          path: apps/myk9show/test-results/load-shards/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate G9 evidence
    needs: [prepare, shard, platform]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shard observations
        uses: actions/download-artifact@v8
        with:
          pattern: load-shard-*
          path: apps/myk9show/test-results/load-shards
          merge-multiple: true

      # Tolerated so eight valid shards still produce evidence when the sampler
      # job died; aggregation records the missing telemetry as a G9 failure.
      - name: Download platform observation
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: load-platform
          path: apps/myk9show/test-results/load-platform

      - name: Aggregate and evaluate G9
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/aggregate-load-shards.ts
        env:
          LOAD_TEST_EVIDENCE_DIR: ../../openspec/changes/repair-load-rehearsal-harness/evidence

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: myk9-109-g9-evidence
          path: openspec/changes/repair-load-rehearsal-harness/evidence/
          if-no-files-found: warn
          retention-days: 30

  cleanup:
    name: Always restore canonical seed
    # Includes `platform` so the reseed cannot land while the sampler is still
    # taking its closing statement snapshot.
    needs: [prepare, shard, platform, aggregate]
    if: ${{ always() && needs.prepare.outputs.restore-required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Abort and drain in-flight scoring work
        env:
          SUPABASE_DB_URL: postgresql://postgres.${{ env.LOAD_TEST_PROJECT_REF }}@${{ env.LOAD_TEST_DB_HOST }}:5432/postgres
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          LOAD_TEST_OWNED_SINCE_US: ${{ needs.prepare.outputs.owned-since-us }}
        run: |
          pnpm --filter @myk9/show exec tsx scripts/load-cleanup.ts

      - name: Clear canonical trial packet snapshots
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @myk9/show exec tsx scripts/load-packet-cleanup.ts

      - name: Restore canonical seed
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            "postgresql://postgres.${LOAD_TEST_PROJECT_REF}@${LOAD_TEST_DB_HOST}:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/seed-demo.sql

      - name: Verify restored postcondition
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Keep this 514/504 contract aligned with src/test/load/loadFixture.ts.
          counts="$(psql \
            "postgresql://postgres.${LOAD_TEST_PROJECT_REF}@${LOAD_TEST_DB_HOST}:5432/postgres" \
            -X -v ON_ERROR_STOP=1 -At -F '|' \
            -c "SELECT count(*), count(*) FILTER (WHERE id::text LIKE 'a1090000-0000-0000-0002-%'), count(*) FILTER (WHERE id::text LIKE 'a1090000-0000-0000-0002-%' AND is_scored) FROM public.entries WHERE show_id = 'dededede-0000-0000-0000-000000000010'::uuid;")"
          [[ "$counts" == "514|504|0" ]] || {
            echo "Canonical cleanup postcondition failed: $counts" >&2
            exit 1
          }
