name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'LICENSE'
      - '.gitignore'
  # Also run on direct pushes to main (post-merge commits) so coverage drift
  # and other regressions surface on the branch they landed on, not on the
  # next contributor's PR. See PR #391 follow-up.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # On push events `github.event.pull_request` is null, and `null.draft == false`
    # evaluates to false in GHA expressions — which would silently skip CI on main.
    # Allow push runs through unconditionally; gate only PRs on non-draft.
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        # Build every package in ./packages/* automatically — new packages get
        # picked up without a workflow edit. Previously enumerated by name,
        # which rotted when @myk9/pwa-update and @myk9/email were added.
        run: pnpm -r --filter='./packages/*' build

      # Tests run THROUGH turbo so the remote cache (TURBO_TOKEN/TURBO_TEAM)
      # provides "affected" behaviour for free: a PR touching only one app turns
      # the other app's test task into a cache hit instead of a full rerun. No
      # git-diff / fetch-depth:0 needed — turbo keys on input-file hashes.
      #
      # Coverage runs only on push-to-main (post-merge), not on every PR — it is
      # pure instrumentation overhead for a pass/fail gate, and `push` runs are
      # where coverage drift should surface (see the trigger comment above).
      - name: Test packages
        run: pnpm test:packages ${{ github.event_name == 'push' && '-- --coverage' || '' }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test myK9Q
        run: pnpm exec turbo run test --filter=@myk9/q -- --reporter=default ${{ github.event_name == 'push' && '--coverage' || '' }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test myK9Show
        run: pnpm exec turbo run test --filter=@myk9/show -- --reporter=default --exclude '**/integration/**' --exclude '**/debug-*.test.*' ${{ github.event_name == 'push' && '--coverage' || '' }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # E2E jobs temporarily disabled to conserve GitHub Actions minutes (1,805/2,000 used).
  # Resets April 1, 2026. Re-enable after reset.
