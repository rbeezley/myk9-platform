name: Relay run artifacts

# Throwaway. Downloads another run's artifacts on the runner and commits them
# under relay-artifacts/ on this branch, so a session whose network policy
# cannot reach the artifact blob host can read them with git. Fires on push to
# its own branch because workflow_dispatch is only registered for the default
# branch. Not for merge.

on:
  push:
    branches:
      - claude/orchestrate-myk9-1345-1351-s8ofq9
    paths:
      - .github/workflows/relay-run-artifacts.yml
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run id whose artifacts to commit
        required: false
        default: '39992612026'

permissions:
  contents: write
  actions: read

concurrency:
  group: relay-run-artifacts
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_RUN_ID: ${{ inputs.run_id || '39992612026' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.RELAY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: relay-artifacts/${{ env.RELAY_RUN_ID }}

      - name: Commit artifacts to this branch
        run: |
          find relay-artifacts -type f -printf '%s %p\n' | sort -k2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f relay-artifacts
          git commit -m "chore(relay): artifacts of run $RELAY_RUN_ID [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
