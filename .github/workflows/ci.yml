name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Also run on direct pushes to main (post-merge commits) so coverage drift
  # and other regressions surface on the branch they landed on, not on the
  # next contributor's PR. See PR #391 follow-up.
  #
  # paths-ignore removed: the workflow must always trigger so required status
  # checks (Quality Checks, Test) always produce a result. Without it, docs-only
  # PRs never trigger CI, required checks stay "pending", and the branch ruleset
  # blocks the merge indefinitely. Turbo cache hits keep docs-only test runs fast.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # On push events `github.event.pull_request` is null, and `null.draft == false`
    # evaluates to false in GHA expressions — which would silently skip CI on main.
    # Allow push runs through unconditionally; gate only PRs on non-draft.
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for git diff origin/main...HEAD merge-base in doc-staleness check

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Code-quality ratchets
        run: pnpm qa:code-quality-ratchet

      - name: Doc staleness check
        run: pnpm qa:doc-staleness:strict

  # Packages run through turbo so the remote cache provides affected-only
  # behaviour: a PR touching only myK9Show turns these into cache hits.
  # Runs in parallel with quality and test-show — no needs: quality.
  #
  # Coverage runs only on push-to-main (post-merge), not on every PR.
  test-packages:
    name: Test packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      - name: Test packages
        run: pnpm test:packages ${{ github.event_name == 'push' && '-- --coverage' || '' }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # myK9Show is sharded across 3 parallel runners to cut wall-clock from ~9 min
  # to ~3 min. Sharding bypasses turbo (turbo's cache key excludes extra args,
  # so shard 2 would incorrectly return shard 1's cached result). Turbo's
  # affected-only skipping is therefore not available here; all 3 shards always
  # run on a cache miss. Runs in parallel with quality and test-packages-and-q.
  test-show:
    name: Test myK9Show (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      - name: Test myK9Show (shard ${{ matrix.shard }}/3)
        working-directory: apps/myk9show
        run: pnpm exec vitest run --reporter=default --exclude '**/integration/**' --exclude '**/debug-*.test.*' --sequence.shuffle --shard=${{ matrix.shard }}/3
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Umbrella job — "Test" is the required check in the branch ruleset.
  # Aggregates test-packages + all test-show shards.
  # always() ensures this job runs even when sub-jobs fail (so GitHub sees a
  # definitive pass/fail rather than a stuck "pending" state). The non-draft
  # condition mirrors the sub-jobs so draft PRs skip this job too — without it,
  # "Test" passes on draft PRs (sub-jobs are skipped → no failure) which lets
  # Build run unnecessarily.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [test-packages, test-show]
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)

    steps:
      - name: All tests passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more test jobs failed or were cancelled"
          exit 1

  # myK9Show coverage — push-to-main only (post-merge signal, not a PR gate).
  # Runs the full non-sharded suite so coverage isn't split across shards.
  # Not required by the branch ruleset; failures surface as a non-blocking check.
  test-show-coverage:
    name: Test myK9Show (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      - name: Test myK9Show (with coverage)
        working-directory: apps/myk9show
        run: pnpm exec vitest run --reporter=default --exclude '**/integration/**' --exclude '**/debug-*.test.*' --sequence.shuffle --coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Gate the myK9Show initial-load payload against recorded budgets.
      # Reuses the dist produced by "Build all"; ratchet down only.
      - name: Bundle budget (myK9Show)
        run: pnpm --filter @myk9/show budget:check

  # Focused accessibility smoke — runs ONLY the axe-core a11y spec against a
  # built preview, not the full (still-disabled) e2e suite. Enforces the
  # color-contrast + serious/critical gate the spec defines. GHA minutes are
  # free post-public-repo, so this is safe to run per-PR. Authenticated role
  # landings inside the spec self-skip when test-user creds are absent, so this
  # job gates the public-page contrast surface without needing those secrets.
  #
  # To make this a *required* check, add "A11y smoke" to the main branch ruleset
  # (GitHub settings — not editable from the repo).
  a11y:
    name: A11y smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify E2E auth credentials
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/verify-e2e-auth-preflight.ts secretary admin judge
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SECRETARY_EMAIL: ${{ secrets.E2E_SECRETARY_EMAIL }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_JUDGE_EMAIL: ${{ secrets.E2E_JUDGE_EMAIL }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}

      # a11y spec runs against `npm run preview` (serves dist/), which does not
      # build — so produce dist here before Playwright starts the web server.
      - name: Build app + packages
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Playwright browser
        run: pnpm --filter @myk9/show exec playwright install --with-deps chromium

      - name: Run a11y smoke
        working-directory: apps/myk9show
        run: pnpm test:a11y
        env:
          CI: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SECRETARY_EMAIL: ${{ secrets.E2E_SECRETARY_EMAIL }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_JUDGE_EMAIL: ${{ secrets.E2E_JUDGE_EMAIL }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: myk9show-a11y-report
          path: apps/myk9show/playwright-report-ci/
          retention-days: 7

  # PR Smoke E2E — 2 stable specs (connectivity + secretary regression proof).
  # Re-enabled 2026-06-18 (Lane 3.2): repo went public 2026-05-18 so GHA
  # minutes are free. Nightly Active suite (20 specs) runs on a separate schedule.
  # playwright.ci.config.ts scopes testMatch to PR Smoke specs only.
  e2e-myk9show:
    name: E2E PR Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify E2E auth credentials
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/verify-e2e-auth-preflight.ts secretary
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_SECRETARY_EMAIL: ${{ secrets.E2E_SECRETARY_EMAIL }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}

      - name: Build app + packages
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Playwright browser
        run: pnpm --filter @myk9/show exec playwright install --with-deps chromium

      - name: Run E2E PR Smoke
        working-directory: apps/myk9show
        run: pnpm test:e2e:ci --fail-on-flaky-tests
        env:
          CI: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_SECRETARY_EMAIL: ${{ secrets.E2E_SECRETARY_EMAIL }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: myk9show-e2e-results
          path: apps/myk9show/playwright-report-ci/
          retention-days: 7
