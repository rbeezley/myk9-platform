name: Release Production

# Production is an explicit operator action. Automatic main-CI promotion lives
# in deploy-staging.yml and has no Vercel deployment credentials.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character main commit SHA to release
        required: true
        type: string
      staging_deployment_id:
        description: READY staging deployment ID accepted by the operator
        required: true
        type: string
      staging_deployment_sha:
        description: Full SHA recorded by the accepted staging deployment
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate production release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate exact SHA and CI evidence
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
          STAGING_DEPLOYMENT_SHA: ${{ inputs.staging_deployment_sha }}
        run: |
          set -euo pipefail

          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a full 40-character SHA" >&2
            exit 1
          }
          [[ "$STAGING_DEPLOYMENT_ID" =~ ^[A-Za-z0-9._:-]+$ ]] || {
            echo "staging_deployment_id is invalid" >&2
            exit 1
          }
          [[ "$STAGING_DEPLOYMENT_SHA" == "$COMMIT_SHA" ]] || {
            echo "staging evidence SHA does not match commit_sha" >&2
            exit 1
          }

          git fetch origin main --no-tags
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main || {
            echo "commit_sha is not reachable from origin/main" >&2
            exit 1
          }

          ci_sha="$(gh run list --workflow CI --branch main --event push --status success --limit 100 --json headSha --jq '.[].headSha' | grep -Fx "$COMMIT_SHA" || true)"
          [[ -n "$ci_sha" ]] || {
            echo "no successful main CI push found for commit_sha" >&2
            exit 1
          }

          echo "commit_sha=$COMMIT_SHA" >>"$GITHUB_OUTPUT"
          echo "Validated main reachability, successful CI, and staging evidence $STAGING_DEPLOYMENT_ID."

  deploy:
    name: Deploy myK9Show to Vercel production
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Verify accepted staging deployment is READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$STAGING_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID&withGitRepoInfo=true" \
            > staging-deployment.json
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/deployments/$STAGING_DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID" \
            > staging-aliases.json
          node - staging-deployment.json "$EXPECTED_SHA" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedSha] = process.argv.slice(2);
          const deployment = JSON.parse(fs.readFileSync(file, 'utf8'));
          const deploymentSha = deployment.meta?.githubCommitSha ?? deployment.gitSource?.sha;
          if (deployment.readyState !== 'READY') {
            throw new Error(`staging deployment is ${deployment.readyState ?? 'unknown'}, not READY`);
          }
          if (deploymentSha !== expectedSha) {
            throw new Error(`staging deployment SHA ${deploymentSha ?? 'missing'} does not match ${expectedSha}`);
          }
          NODE
          node - staging-aliases.json <<'NODE'
          const fs = require('node:fs');
          const aliases = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!aliases.aliases?.some(({ alias }) => alias === 'staging.myk9show.com')) {
            throw new Error('accepted staging deployment does not own staging.myk9show.com');
          }
          NODE
          curl --fail --silent --show-error --head https://staging.myk9show.com >/dev/null
          rm -f staging-deployment.json staging-aliases.json

      - name: Deploy exact approved SHA to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(pnpm dlx vercel@latest deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN")"
          echo "Deployed: $url"
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: Verify released deployment owns production domain
        id: verify_production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.commit_sha }}
          PRODUCTION_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          PRODUCTION_DEPLOYMENT_REF="${PRODUCTION_URL#https://}"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$PRODUCTION_DEPLOYMENT_REF?teamId=$VERCEL_ORG_ID&withGitRepoInfo=true" \
            > production-deployment.json
          PRODUCTION_DEPLOYMENT_ID="$(node - production-deployment.json "$EXPECTED_SHA" "$VERCEL_PROJECT_ID" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedSha, expectedProjectId] = process.argv.slice(2);
          const deployment = JSON.parse(fs.readFileSync(file, 'utf8'));
          const deploymentSha = deployment.meta?.githubCommitSha ?? deployment.gitSource?.sha;
          if (deployment.readyState !== 'READY') {
            throw new Error(`production deployment is ${deployment.readyState ?? 'unknown'}, not READY`);
          }
          if (deploymentSha !== expectedSha) {
            throw new Error(`production deployment SHA ${deploymentSha ?? 'missing'} does not match ${expectedSha}`);
          }
          if (deployment.projectId !== expectedProjectId) {
            throw new Error('production deployment belongs to an unexpected Vercel project');
          }
          const deploymentId = deployment.id ?? deployment.uid;
          if (!deploymentId) {
            throw new Error('production deployment response is missing its deployment ID');
          }
          process.stdout.write(deploymentId);
          NODE
          )"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/deployments/$PRODUCTION_DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID" \
            > production-aliases.json
          node - production-aliases.json <<'NODE'
          const fs = require('node:fs');
          const aliases = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!aliases.aliases?.some(({ alias }) => alias === 'myk9show.com')) {
            throw new Error('released production deployment does not own myk9show.com');
          }
          NODE
          curl --fail --silent --show-error --head "$PRODUCTION_URL" >/dev/null
          curl --fail --silent --show-error --head https://myk9show.com >/dev/null
          echo "deployment_id=$PRODUCTION_DEPLOYMENT_ID" >>"$GITHUB_OUTPUT"
          rm -f production-deployment.json production-aliases.json

      - name: Summary
        run: |
          {
            echo "### Production release"
            echo ""
            echo "- Commit: \`${{ needs.preflight.outputs.commit_sha }}\`"
            echo "- Deployment: \`${{ steps.verify_production.outputs.deployment_id }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Verified domain: \`myk9show.com\`"
          } >>"$GITHUB_STEP_SUMMARY"
