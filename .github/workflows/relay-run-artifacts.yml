name: Relay run artifacts

# Throwaway. Downloads other runs' artifacts on the runner and commits them
# under relay-artifacts/<run id>/ on this branch, so a session whose network
# policy cannot reach the artifact blob host can read them with git. Fires on
# push to its own branch because workflow_dispatch is only registered for the
# default branch. Not for merge.

on:
  push:
    branches:
      - claude/orchestrate-myk9-1345-1351-s8ofq9
    paths:
      - .github/workflows/relay-run-artifacts.yml
  workflow_dispatch:
    inputs:
      run_ids:
        description: Space-separated workflow run ids whose artifacts to commit
        required: false
        default: '39487970380 39805714958 39992612026'

permissions:
  contents: write
  actions: read

concurrency:
  group: relay-run-artifacts
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_RUN_IDS: ${{ inputs.run_ids || '39487970380 39805714958 39992612026' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Download artifacts of run 39487970380
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: 39487970380
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: relay-artifacts/39487970380

      - name: Download artifacts of run 39805714958
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: 39805714958
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: relay-artifacts/39805714958

      - name: Download artifacts of run 39992612026
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: 39992612026
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: relay-artifacts/39992612026

      - name: Commit artifacts to this branch
        run: |
          find relay-artifacts -type f -printf '%s %p\n' | sort -k2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f relay-artifacts
          if git diff --cached --quiet; then
            echo 'nothing new to commit'
            exit 0
          fi
          git commit -m "chore(relay): artifacts of runs $RELAY_RUN_IDS [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
