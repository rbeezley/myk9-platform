# Playwright Regression — stateful curated myK9Show suite (beyond the 2-spec PR
# smoke in ci.yml). This is intentionally separate from the read-only nightly
# health workflow because these journeys can create or mutate E2E data.
#
# Weekly plus manual dispatch. Each job owns a disposable local Supabase target,
# resets it between two complete runs, and rejects shared staging before writes.
#
# Gated separately from the read-only smoke variable.
name: Playwright Regression

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  playwright-regression:
    name: Stateful Playwright Regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: vars.MYK9SHOW_REGRESSION_CI_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated Supabase target
        run: pnpm qa:isolated-e2e:prepare
        env:
          MYK9_PLAYWRIGHT_REGRESSION_ENABLED: 'true'
          MYK9_PLAYWRIGHT_REGRESSION_TARGET: isolated
          MYK9_E2E_APPROVED_PROJECT_REFS: local
          MYK9_E2E_SUPABASE_PROJECT_REF: local
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      # The regression suite spans secretary, admin, judge, and demo-exhibitor
      # journeys, so preflight every role before starting the browser suite.
      - name: Verify E2E auth credentials
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/verify-e2e-auth-preflight.ts secretary admin judge exhibitor
        env:
          E2E_SECRETARY_EMAIL: ${{ secrets.E2E_SECRETARY_EMAIL }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_EMAIL: ${{ secrets.E2E_JUDGE_EMAIL }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_EMAIL: ${{ secrets.E2E_DEMO_EXHIBITOR_EMAIL }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Build app + packages
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Install Playwright browser
        run: pnpm --filter @myk9/show exec playwright install --with-deps chromium

      - name: Run Playwright Regression
        run: pnpm qa:playwright:regression
        env:
          CI: 'true'
          MYK9_PLAYWRIGHT_REGRESSION_ENABLED: 'true'
          MYK9_PLAYWRIGHT_REGRESSION_TARGET: isolated
          E2E_SECRETARY_EMAIL: ${{ secrets.E2E_SECRETARY_EMAIL }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_EMAIL: ${{ secrets.E2E_JUDGE_EMAIL }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_EMAIL: ${{ secrets.E2E_DEMO_EXHIBITOR_EMAIL }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Preserve first regression report
        if: always()
        run: |
          if [ -d apps/myk9show/playwright-report-ci ]; then
            cp -R apps/myk9show/playwright-report-ci apps/myk9show/playwright-report-ci-first
          fi

      - name: Reset isolated target
        if: success()
        run: pnpm qa:isolated-e2e:reset
        env:
          MYK9_PLAYWRIGHT_REGRESSION_ENABLED: 'true'
          MYK9_PLAYWRIGHT_REGRESSION_TARGET: isolated
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Run Playwright Regression Again
        if: success()
        run: pnpm qa:playwright:regression
        env:
          CI: 'true'
          MYK9_PLAYWRIGHT_REGRESSION_ENABLED: 'true'
          MYK9_PLAYWRIGHT_REGRESSION_TARGET: isolated
          E2E_SECRETARY_EMAIL: ${{ secrets.E2E_SECRETARY_EMAIL }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_EMAIL: ${{ secrets.E2E_JUDGE_EMAIL }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_EMAIL: ${{ secrets.E2E_DEMO_EXHIBITOR_EMAIL }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Upload Playwright regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: myk9show-playwright-regression-report
          path: |
            apps/myk9show/playwright-report-ci/
            apps/myk9show/playwright-report-ci-first/
          retention-days: 7

      - name: Stop isolated Supabase target
        if: always()
        run: pnpm qa:isolated-e2e:stop
