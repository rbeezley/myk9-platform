name: Nightly myK9Show TZ

# The full myK9Show unit suite with the device clock in UTC-10
# (TZ=Pacific/Honolulu), nightly against main plus manual dispatch.
#
# CI runs in UTC, so a test or product path that only works when the device
# day equals the trial day stays invisible (the timezone class escaped six
# times: MYK9-288, 505, 714, 1174, 1354, 1554). Pacific/Honolulu is far from
# UTC and from the seeded trial zones, so the device day and the trial day
# differ for most of every day.
#
# MYK9-1655 ran this on every PR and push; MYK9-1671 moved it here because it
# doubled the test shards per CI run (6 to 12) and queued the deploy behind
# them. A red night opens or updates the tracking issue (report-status below),
# so it is not a PR or deploy gate.
#
# No coverage: test-show in ci.yml already measures that, and v8 coverage is
# the slowest part of a shard. Same exclusions, shuffle and NODE_OPTIONS as
# test-show, so the suite is the one that failed when the MYK9-1554 fix was
# reverted.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Serialized, so the tracking-issue reconciliation stays free of a
# lookup/create race between two runs of the whole workflow.
concurrency:
  group: nightly-show-tz
  cancel-in-progress: false

jobs:
  test-show-tz:
    name: Test myK9Show, TZ Pacific/Honolulu (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      - name: Test myK9Show under TZ=Pacific/Honolulu (shard ${{ matrix.shard }}/6)
        working-directory: apps/myk9show
        run: pnpm exec vitest run --exclude '**/integration/**' --exclude '**/debug-*.test.*' --sequence.shuffle --shard=${{ matrix.shard }}/6
        env:
          TZ: Pacific/Honolulu
          NODE_OPTIONS: --max-old-space-size=4096

  # Its OWN job, because `job.status` inside a shard would describe only that
  # shard. `needs.test-show-tz.result` is failure if any of the six failed.
  report-status:
    name: Report status to the tracking issue
    runs-on: ubuntu-latest
    needs: [test-show-tz]
    if: always()
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/report-scheduled-failure
        with:
          workflow-name: Nightly myK9Show TZ
          outcome: ${{ needs.test-show-tz.result }}
          token: ${{ secrets.GITHUB_TOKEN }}
          extra: 'The myK9Show unit suite failed under TZ=Pacific/Honolulu: a test or product path depends on the device day matching the trial day.'
