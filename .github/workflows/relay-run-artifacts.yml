name: Relay run artifacts

# Throwaway, dispatch-only. Downloads another run's artifacts on the runner and
# prints every text file into this job's log, so a session whose network policy
# cannot reach the artifact blob host can still read them. Not for merge.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run id whose artifacts to print
        required: true

permissions:
  contents: read
  actions: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: relay

      - name: Print artifacts
        run: |
          echo '===== FILE TREE'
          find relay -type f -printf '%s %p\n' | sort -k2
          find relay -type f \( -name '*.md' -o -name '*.json' -o -name '*.txt' -o -name '*.csv' -o -name '*.log' \) | sort | while read -r f; do
            echo "===== BEGIN $f"
            cat "$f"
            echo
            echo "===== END $f"
          done
