name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Also run on direct pushes to main (post-merge commits) so coverage drift
  # and other regressions surface on the branch they landed on, not on the
  # next contributor's PR. See PR #391 follow-up.
  #
  # paths-ignore removed: the workflow must always trigger so required status
  # checks (Quality Checks, Test) always produce a result. Without it, docs-only
  # PRs never trigger CI, required checks stay "pending", and the branch ruleset
  # blocks the merge indefinitely. Turbo cache hits keep docs-only test runs fast.
  push:
    branches: [main]

# PR runs are superseded by the next push (one group per ref, cancel on push).
# A `main` run is never cancelled OR replaced: merges land minutes apart and
# the push-only coverage job takes ~25 min, so a ref-keyed group left 25 of 30
# consecutive main runs without a verdict (2026-09-06/07) -- and GitHub keeps
# only ONE queued run per group, so `cancel-in-progress: false` alone would
# still let a third merge replace the second's pending run (Codex review of
# #2110). Keying main's group by SHA gives every main commit its own run.
# scripts/qa/ci-concurrency.test.ts pins both halves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Browser smoke tests are valuable for runtime/UI changes, but too expensive
  # for docs/tooling-only PRs. This job keeps required CI checks present while
  # letting E2E/a11y smoke run only when relevant paths changed. Add the
  # `run-smoke` PR label to force browser smoke, or `skip-smoke` for an explicit
  # tooling/docs override. Dependabot PRs get no special treatment (MYK9-520):
  # see the comment above the `a11y` job and .github/dependabot.yml.
  smoke-scope:
    name: Smoke scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide browser smoke scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: |
          set -euo pipefail

          if [[ ",${PR_LABELS}," == *",run-smoke,"* ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "reason=forced by run-smoke label" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ",${PR_LABELS}," == *",skip-smoke,"* ]]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "reason=skipped by skip-smoke label" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          else
            changed_files="$(git diff --name-only "${PUSH_BEFORE_SHA}..HEAD")"
          fi

          run_smoke=false
          while IFS= read -r file; do
            case "$file" in
              apps/myk9show/src/*|\
              apps/myk9show/public/*|\
              apps/myk9show/scripts/*|\
              apps/myk9show/index.html|\
              apps/myk9show/package.json|\
              package.json|\
              pnpm-lock.yaml|\
              apps/myk9show/playwright.config.*|\
              apps/myk9show/playwright.ci.config.ts|\
              apps/myk9show/vite.config.*|\
              packages/core/*|\
              packages/replication/*|\
              packages/ringside/*|\
              packages/scoring/*|\
              packages/scoring-ui/*|\
              packages/supabase/*|\
              packages/ui/*|\
              .github/workflows/ci.yml)
                run_smoke=true
                break
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$run_smoke" == "true" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "reason=frontend/runtime files changed" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "reason=no frontend/runtime files changed" >>"$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # On push events `github.event.pull_request` is null, and `null.draft == false`
    # evaluates to false in GHA expressions — which would silently skip CI on main.
    # Allow push runs through unconditionally; gate only PRs on non-draft.
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for git diff origin/main...HEAD merge-base in doc-staleness check

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Lint
        run: pnpm lint

      # Files changed vs the merge base, not the whole tree: a tree-wide check
      # would go red on main the moment a worktree that predates the one-time
      # reformat (#2121) merged its unformatted files, and would block every
      # unrelated PR until someone reformatted them. The changed-files check
      # ratchets: every PR leaves the files it touches formatted.
      - name: Prettier (changed files vs merge base)
        run: pnpm format:check:changed

      - name: Load harness anti-rot
        run: |
          pnpm --filter @myk9/show test:load:unit
          pnpm --filter @myk9/show test:load:list
        env:
          LOAD_TEST_MODE: discovery

      - name: Browser session lifecycle
        run: pnpm qa:browser-session:test

      - name: Nightly health workflow contract
        run: pnpm qa:nightly:workflow:test

      - name: Detect backup integration changes
        id: backup-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && git diff --quiet "$BASE_SHA" HEAD -- scripts/backup .github/actions/setup-backup-clients; then
            echo 'native=false' >> "$GITHUB_OUTPUT"
          else
            echo 'native=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install backup clients
        if: steps.backup-scope.outputs.native == 'true'
        uses: ./.github/actions/setup-backup-clients
      - name: Independent database backup tests
        env:
          BACKUP_REQUIRE_NATIVE_CLIENT: ${{ steps.backup-scope.outputs.native }}
        run: |
          pnpm qa:backups:typecheck
          pnpm qa:backups:test

      # The map (docs/qa/e2e-suite-map.md) is where a spec's suite is decided:
      # PR smoke, nightly, feature-audit, manual-debug, or candidate-delete. A
      # spec absent from it belongs to no suite, so nobody owns its result.
      # This checker already existed and already failed; nothing ran it, so the
      # map drifted by eight specs — myEntriesZoomReflow.spec.ts among them,
      # which then went red across four PRs with no suite to notice.
      - name: E2E suite map drift
        run: pnpm qa:e2e-map:check

      # Every data-testid an e2e spec or helper names must exist in the app or
      # a package (MYK9-617). 592 dangling references had accumulated in suites
      # nothing ran; ids the app builds by interpolation live in the sidecar
      # allowlist, which the audit re-verifies against the producer each run.
      - name: E2E test-id audit
        run: |
          pnpm qa:e2e-testid-audit --self-test
          pnpm qa:e2e-testid-audit

      - name: Behavioral SQL harness contract
        run: pnpm qa:sql:behavioral:test

      # The merge gate's own detector. An untested CI watcher reports its own
      # bugs as good news: on #2045 a jq error made every Vercel failure
      # invisible, and it printed failed=[] for forty minutes on a red board.
      # `--self-test` needs no network — it replays known-answer rollups,
      # including the shapes that broke it.
      - name: PR check-watcher contract
        run: |
          pnpm qa:pr-checks:test
          pnpm qa:pr-checks --self-test

      - name: CI coverage gate contract
        run: pnpm qa:ci-coverage-gate:test

      - name: Staging promotion gate contract
        run: pnpm qa:gating-jobs:test

      # A commit to a public repo is permanent: deleting a file later does not
      # remove it from history, clones or forks. This fails when a change
      # introduces a file carrying personal data at EXPORT scale (>=10 distinct
      # real addresses), which ordinary code and prose never reach. It guards
      # the unattended path in particular - scheduled QA walks and audits write
      # their output back into the repo with nobody reading the diff.
      - name: Bulk-PII guard
        env:
          # Required on push runs. The workflow checks out main itself, so
          # `origin/main` IS `HEAD` and a merge-base diff is empty — without
          # this the guard scanned zero files and passed on every
          # direct-to-main commit, which is the path it most needs to watch.
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          pnpm qa:bulk-pii:test
          pnpm qa:bulk-pii

      # The Review gate workflow (review-gate.yml) posts a status computed by
      # scripts/qa/review-gate.ts; its unit tests run here so a change to the
      # evidence format cannot land without the checker's tests agreeing.
      # review-tier.ts owns the risk map that gate refuses evidence below, so
      # its suite runs in the same step — the root vitest project is never
      # loaded by the bare vitest jobs below (they set working-directory:
      # apps/myk9show), so without this line it ran nowhere in CI (F1).
      - name: Review gate contract
        run: |
          pnpm qa:review-gate:test
          pnpm qa:review-tier:test
          pnpm qa:launcher-pin:test
          pnpm qa:typecheck-scripts:test
          pnpm qa:deferred-reviews:test

      # Executable forms of two CLAUDE.md lessons: the review wrappers (exit 0
      # is not a verdict; always --base) plus post-review-gate.sh, the only
      # writer of `Review gate:` evidence — it refuses a log that does not
      # support the verdict — and the package-dist freshness check the app's
      # `test` script runs before vitest.
      - name: Codex review wrapper + dist freshness contracts
        run: |
          pnpm qa:codex-review:test
          pnpm qa:post-review-gate:test
          pnpm qa:claude-review:test
          pnpm qa:dist-fresh:test
          pnpm qa:inflight:test
          pnpm qa:edge-function-drift:test
          pnpm qa:worktree-liveness:test
          pnpm qa:primary-checkout:test
          pnpm qa:no-ci-polling:test
          pnpm qa:prelaunch-tripwire:test
          pnpm qa:ci-concurrency:test
          pnpm qa:deploy-picker:test
          pnpm qa:shared-rules:test
          pnpm qa:shared-rules

      # The issue janitor (MYK9-1434) plans unattended Linear dispositions; its
      # planner, reader and branch tests live in the root vitest project, which
      # the app test jobs never load, so they run here or nowhere.
      - name: Issue janitor planner contract
        run: pnpm qa:issue-janitor:test

      # The cloud-agent tooling (MYK9-1397): publication scan, handoff ledger,
      # preflight, changed-function deno selection and checkout portability.
      # The app and package jobs exclude scripts/, so this is its only run.
      - name: Cloud agent tooling contracts
        run: pnpm qa:cloud:test

      # Scheduled-task prompts live outside this repo, so the CLI itself can only
      # run on the machine that owns them. Its tests are repo-only and do run
      # here: they pin the registry against the docs (an unregistered task is
      # never compared) and pin MYK9-408's rule that no prompt may assert
      # another automation's live/dark state as fact.
      - name: Scheduled-task prompt parity contract
        run: pnpm qa:prompt-parity:test

      # MYK9-1432: a scripts/**/*.test.ts file only runs in CI when a `pnpm
      # qa:*:test` line in a workflow invokes a script that lists it. The guard
      # fails by name on any file nothing runs (a conditional step, like the
      # backup one, still counts as CI-run). The remaining suites here are
      # root-project contracts that had a script but no CI line.
      - name: Scripts test wiring guard + unwired root tooling suites
        run: |
          pnpm qa:scripts-test-wiring:test
          pnpm qa:code-quality-ratchet:test
          pnpm qa:db-drift:test
          pnpm qa:isolated-e2e:test
          pnpm qa:rls-smoke:test
          pnpm support:triage:test
          pnpm qa:go-live:phase1:test
          pnpm qa:go-live:phase2:test
          pnpm qa:go-live:phase3:test
          pnpm qa:go-live:phase4:test

      - name: Code-quality ratchets
        run: pnpm qa:code-quality-ratchet

      - name: Doc staleness check
        run: pnpm qa:doc-staleness:strict

      - name: Check plan metadata
        run: |
          pnpm qa:plans:test
          pnpm qa:plans

      - name: Supabase types drift contract
        run: pnpm qa:types-drift:test

      - name: Migration version guard
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          MYK9_MIGRATION_DATABASE_URL: postgresql://postgres.sojmvhhwsjxmfistvzbe@aws-1-us-east-2.pooler.supabase.com:5432/postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pnpm qa:migrations:guard:test
          pnpm qa:migrations:guard

  # Report-only: compares the committed Supabase types against the applied
  # schema. MYK9-484 found the file 28 objects behind the database; MYK9-488
  # added this so the gap is visible on every run. It can never block: a
  # migration is applied by `supabase db push` AFTER its PR merges, so the
  # migration PR can never carry matching types, and a blocking check would go
  # red on every unrelated PR opened between the push and the regeneration.
  # The drift step carries continue-on-error, so the job concludes success
  # either way; drift shows as a warning annotation and in the step summary,
  # by object name. Not in the main-required-checks ruleset, and on the gating
  # evaluator's informational list. The generator needs Docker for the
  # postgres-meta image, which ubuntu-latest provides.
  types-drift:
    name: Supabase types drift (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'

      # The drift script formats both sides with the repo's own Prettier.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Compare committed types with the applied schema
        continue-on-error: true
        env:
          MYK9_MIGRATION_DATABASE_URL: postgresql://postgres.sojmvhhwsjxmfistvzbe@aws-1-us-east-2.pooler.supabase.com:5432/postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm qa:types-drift

  # Executable SQL tests. The financial contracts use a minimal throwaway
  # Postgres cluster; the behavioral RLS/RPC contracts need the complete
  # Supabase schema and therefore run against a clean local Supabase target.
  # Neither harness can target a shared database.
  sql-tests:
    name: SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Financial migration SQL tests
        # REQUIRE=1 so a runner image without Postgres fails loudly instead of
        # skipping to a silent green.
        env:
          MYK9_SQL_TEST_REQUIRE: '1'
        run: bash scripts/qa/run-financial-sql-tests.sh

      - name: Start clean local Supabase
        run: supabase start --exclude edge-runtime,imgproxy,logflare,mailpit,postgres-meta,studio,supavisor,vector

      - name: Apply all migrations without seed data
        run: supabase db reset --no-seed

      - name: Behavioral RLS and RPC SQL tests
        env:
          MYK9_BEHAVIORAL_SQL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/qa/run-behavioral-sql-tests.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version

      - name: Lifecycle absent installed SQL mutation proof
        env:
          MYK9_BEHAVIORAL_SQL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node --experimental-strip-types scripts/qa/class-absent-mutation.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # Packages run through turbo so the remote cache provides affected-only
  # behaviour: a PR touching only myK9Show turns these into cache hits.
  # Runs in parallel with quality and test-show — no needs: quality.
  #
  # Coverage runs only on push-to-main (post-merge), not on every PR.
  test-packages:
    name: Test packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      # `--coverage` on EVERY event, not just `push`. It used to be push-only,
      # which meant the thresholds in each package's vitest.config.ts were
      # unenforceable on a PR: a change that lowered coverage was green on its
      # own PR and turned `main` red on merge, with nothing to point at but the
      # merge commit.
      #
      # That is not hypothetical — it is how #1990 (MYK9-328) reddened `main`
      # for 18 hours across 12 commits. It deleted 2,228 lines of well-covered
      # code from packages/core, which shrank the coverage DENOMINATOR below the
      # thresholds. The PR was green by construction, and the failure surfaced
      # on a later, unrelated docs-only commit.
      #
      # The myK9Show side already worked this way: `Test myK9Show` collects
      # coverage on every event and `Test myK9Show (coverage gate)` enforces it
      # on PRs. This brings packages into line.
      #
      # Measured cost on this job: 136s with coverage vs 96s without, and it
      # runs in parallel with the myK9Show shards, so it does not extend the
      # critical path.
      - name: Test packages
        run: pnpm test:packages -- --sequence.shuffle --coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # myK9Show is sharded across 6 parallel runners. Sharding bypasses turbo
  # (turbo's cache key excludes extra args, so shard 2 would incorrectly return
  # shard 1's cached result). Turbo's affected-only skipping is therefore not
  # available here; all shards always run on a cache miss. Runs in parallel
  # with quality, test-packages, sql-tests and the build/smoke chain.
  #
  # Shard count history: 3 shards measured 11m / 11m / 7m on 2026-09-05 and
  # were the whole critical path (vitest splits by file COUNT, not duration,
  # hence the imbalance). Six halves the longest shard; the repo is public, so
  # runner minutes are free and the extra runners cost nothing.
  test-show:
    name: Test myK9Show (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # Coverage-enabled shards can exceed the normal test budget on a cold
    # runner. Keep the job alive long enough to report the actual test result.
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      # Coverage is collected per-shard as a v8 "blob" report (raw coverage
      # data, not a rendered report) — cheap to add, and it's what the
      # coverage-merge job below combines via `vitest --mergeReports` to
      # recover whole-app coverage numbers despite the suite being split
      # across 6 runners. See MYK9-40.
      - name: Test myK9Show (shard ${{ matrix.shard }}/6)
        working-directory: apps/myk9show
        run: pnpm exec vitest run --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/shard-${{ matrix.shard }}.json --exclude '**/integration/**' --exclude '**/debug-*.test.*' --sequence.shuffle --shard=${{ matrix.shard }}/6 --coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload coverage blob (shard ${{ matrix.shard }}/6)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: apps/myk9show/.vitest-reports/shard-${{ matrix.shard }}.json
          retention-days: 1

  # Merges the 6 shards' coverage blobs into one whole-app coverage report,
  # then gates the PR on two things in the same vitest invocation:
  #   1. The per-directory floors declared in apps/myk9show/vitest.config.ts
  #      (`coverage.thresholds`) — vitest itself fails the run if a
  #      high-stakes directory (payment/scoring/rbac/replication) drops
  #      below its recorded floor.
  #   2. The coverage ratchet (scripts/coverage-ratchet.ts) — fails the PR
  #      if whole-app line coverage (or statements/branches/functions) drops
  #      below apps/myk9show/scripts/coverage-ratchet.baseline.json.
  # Required by the branch ruleset via the "Test" umbrella job below.
  test-show-coverage-gate:
    name: Test myK9Show (coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-show]
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      - name: Download coverage blobs
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-blob-*
          path: apps/myk9show/.vitest-reports
          merge-multiple: true

      - name: Merge shard coverage + enforce per-directory thresholds
        working-directory: apps/myk9show
        run: pnpm exec vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary --mergeReports=.vitest-reports

      - name: Coverage ratchet (whole-app, vs main)
        working-directory: apps/myk9show
        run: pnpm coverage:ratchet

  # Umbrella job — "Test" is the required check in the branch ruleset.
  # Aggregates test-packages + all test-show shards + the coverage gate.
  # always() ensures this job runs even when sub-jobs fail (so GitHub sees a
  # definitive pass/fail rather than a stuck "pending" state). The non-draft
  # condition mirrors the sub-jobs so draft PRs skip this job too — without it,
  # "Test" passes on draft PRs (sub-jobs are skipped → no failure) which lets
  # Build run unnecessarily.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [test-packages, test-show, test-show-coverage-gate, sql-tests]
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)

    steps:
      - name: All tests passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more test jobs failed or were cancelled"
          exit 1

  # Build no longer waits for the Test umbrella: it needs only an install, and
  # gating it on tests put the whole build -> E2E/a11y chain serially AFTER the 11-minute unit shards. Running it from t=0 lets
  # that chain finish while the shards are still going. The repo is public, so
  # a build that runs on a PR whose tests then fail costs nothing but a runner.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Gate the myK9Show initial-load payload against recorded budgets.
      # Reuses the dist produced by "Build all"; ratchet down only.
      - name: Bundle budget (myK9Show)
        run: pnpm --filter @myk9/show budget:check

  # Browser smoke runs against a disposable local Supabase that each job builds
  # for itself, never the live project (MYK9-1449). On 2026-10-27 one E2E PR
  # Smoke run signed the fixture accounts into production and held p95 API
  # latency at 4-5 s for real users for eight minutes. `pnpm
  # qa:isolated-e2e:prepare` is the same target Playwright Regression uses
  # (MYK9-61): it starts the stack, seeds the fixture accounts and the demo
  # show, and writes VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY (loopback) into
  # GITHUB_ENV, so every later step in the job builds and tests against it.
  # The bundle is therefore built per job: the anon key belongs to that job's
  # stack, which is why there is no shared `Smoke build` job any more.
  #
  # Dependabot PRs run both jobs like any other PR (MYK9-520). A
  # Dependabot-triggered `pull_request` run gets only the Dependabot-scope
  # secrets; these jobs need only the E2E_* passwords, which are registered
  # there (verified 2026-09-25). Each job's actor-gated "Verify Dependabot-run
  # secrets are available" step fails loudly if one is ever missing, instead of
  # seeding accounts with an empty password. Never `pull_request_target` here:
  # it would run the PR's code with the repository's secrets and a write token.
  #
  # NO E2E_*_EMAIL secrets, deliberately: the seed hard-codes the @myk9t.com
  # addresses (setup-e2e-test-users.ts), and an override would point a sign-in
  # at an account the seed never created (see nightly-e2e.yml).

  # Focused accessibility smoke — runs ONLY the axe-core a11y spec against a
  # built preview, not the full e2e suite. Opt-in via the
  # MYK9SHOW_SMOKE_CI_ENABLED repository variable.
  #
  # To make this a *required* check, add "A11y smoke" to the main branch ruleset
  # (GitHub settings — not editable from the repo).
  a11y:
    name: A11y smoke
    runs-on: ubuntu-latest
    # Was 25. Preparing the local stack (~2 min) and building the bundle here
    # (~2 min) moved into this job (MYK9-1449). The Playwright install keeps its
    # own 12-minute cap (MYK9-1335).
    timeout-minutes: 30
    needs: [build, smoke-scope]
    # Runs on Dependabot PRs too, with the Dependabot-scope secrets (MYK9-520):
    # see the comment above.
    if: (github.event_name == 'push' || github.event.pull_request.draft == false) && vars.MYK9SHOW_SMOKE_CI_ENABLED == 'true' && needs.smoke-scope.outputs.run == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gives a labelled Dependabot PR a clear, actionable failure instead of
      # an account seeded with an empty password (MYK9-520).
      - name: Verify Dependabot-run secrets are available
        if: github.actor == 'dependabot[bot]'
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in E2E_ADMIN_PASSWORD E2E_SECRETARY_PASSWORD E2E_JUDGE_PASSWORD E2E_DEMO_EXHIBITOR_PASSWORD; do
            [[ -z "${!name:-}" ]] && missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Repository secrets are withheld from Dependabot-triggered runs (missing: ${missing[*]}). Register the E2E_* passwords under Settings -> Secrets and variables -> Dependabot, or push a human commit to this branch. See .github/dependabot.yml."
            exit 1
          fi

      - name: Prepare isolated Supabase target
        run: pnpm qa:isolated-e2e:prepare
        env:
          MYK9_PLAYWRIGHT_REGRESSION_ENABLED: 'true'
          MYK9_PLAYWRIGHT_REGRESSION_TARGET: isolated
          MYK9_E2E_APPROVED_PROJECT_REFS: local
          MYK9_E2E_SUPABASE_PROJECT_REF: local
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Verify E2E auth credentials
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/verify-e2e-auth-preflight.ts --check-roles secretary admin judge
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}

      - name: Build app + packages
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # The acceptance criterion as a check: the bundle the browser loads must
      # name the loopback stack and never the live project (MYK9-1449).
      - name: Prove the bundle targets the local stack
        run: bash scripts/ci/assert-local-smoke-bundle.sh apps/myk9show/dist

      # Cache the browser payload by the lockfile so Playwright downloads only
      # when the pinned browser version changes. Keep --with-deps to guarantee
      # the runner has the system libraries required by Chromium.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # MYK9-1335: the slow half of --with-deps is apt downloading Chromium's
      # system packages, not the browser: on 2026-10-22 the Azure Ubuntu mirror
      # took ~10 min for a few MB, three runs in a row, and pushed the job past
      # its cap with the tests themselves passing. Keep the downloaded .debs in
      # a runner-owned cache so a warm run installs them without the mirror.
      - name: Cache Playwright system packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/playwright-apt
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-apt-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-playwright-apt-

      - name: Point apt at the package cache
        run: |
          mkdir -p ~/.cache/playwright-apt/partial
          echo "Dir::Cache::Archives \"$HOME/.cache/playwright-apt\";" \
            | sudo tee /etc/apt/apt.conf.d/99-playwright-cache

      # Its own cap, so a slow mirror reads as this step timing out, not as a
      # cancelled test run.
      - name: Install Playwright browser
        timeout-minutes: 12
        run: pnpm --filter @myk9/show exec playwright install --with-deps chromium

      # apt writes the archive as root; hand it back so the cache can save it.
      - name: Hand the package cache back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/playwright-apt

      - name: Run a11y smoke
        working-directory: apps/myk9show
        run: pnpm test:a11y
        env:
          CI: 'true'
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}

      # MYK9-1128: fail the job (and so skip the upload below) if a configured secret is
      # still in the artifact, including inside the HTML report's embedded zip. Prints
      # file names and counts only. Trace zips are not uploaded, so they are skipped.
      - name: Verify no secrets in artifacts (a11y report)
        id: verify-artifacts
        if: always()
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/verify-artifact-secrets.ts --skip-zip-files playwright-report-ci
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}

      - name: Upload a11y report
        if: ${{ always() && steps.verify-artifacts.outcome != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: myk9show-a11y-report
          # Never the trace archives: they hold test-account tokens and this
          # repository's artifacts are public (MYK9-1057).
          path: |
            apps/myk9show/playwright-report-ci/
            !apps/myk9show/playwright-report-ci/**/*.zip
          retention-days: 7

      - name: Stop isolated Supabase target
        if: always()
        run: pnpm qa:isolated-e2e:stop

  # PR Smoke E2E — the stable specs in playwright.ci.config.ts PR_SMOKE_SPECS,
  # against this job's own disposable local Supabase (MYK9-1449; see the
  # comment above the a11y job). Opt-in via the MYK9SHOW_SMOKE_CI_ENABLED
  # repository variable.
  e2e-myk9show:
    name: E2E PR Smoke
    runs-on: ubuntu-latest
    # Was 25. Preparing the local stack (~2 min) and building the bundle here
    # (~2 min) moved into this job (MYK9-1449). The Playwright install keeps its
    # own 12-minute cap (MYK9-1335).
    timeout-minutes: 30
    needs: [build, smoke-scope]
    # Runs on Dependabot PRs too, with the Dependabot-scope secrets (MYK9-520):
    # see the comment above the a11y job.
    if: (github.event_name == 'push' || github.event.pull_request.draft == false) && vars.MYK9SHOW_SMOKE_CI_ENABLED == 'true' && needs.smoke-scope.outputs.run == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

