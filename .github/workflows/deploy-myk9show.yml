name: Deploy myK9Show

# Pre-launch deploy on demand. Vercel's Git integration no longer builds
# myK9Show (apps/myk9show/vercel.json sets git.deploymentEnabled to false), so
# merging to main changes nothing live: production moves only when someone runs
# this workflow. It builds here, on free Actions minutes, and uploads the
# finished output with `vercel deploy --prebuilt`, so a deploy costs Vercel one
# deployment and no build minutes. MYK9-44 replaces this with the CI-gated
# staging -> production path in deploy-staging.yml / deploy-production.yml.
#
#   gh workflow run deploy-myk9show.yml                       # newest green main
#   gh workflow run deploy-myk9show.yml -f commit_sha=<sha>   # a specific commit
#
# Either way the run refuses a commit that does not contain what myk9show.com
# serves (no rollbacks; use Vercel's Instant Rollback for that) and reports a
# commit production already serves as nothing to deploy (MYK9-2240).

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character main commit SHA (blank = newest main commit with a green CI run)
        required: false
        type: string
      rebuild_live:
        description: Rebuild even when production already serves this commit (after a Vercel setting change). Never allows a rollback.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# One run executes at a time, so the live-commit check below (MYK9-2240) cannot
# race another dispatch: a run that waited sees what the run before it
# published. A newer dispatch cancels an older one still PENDING (GitHub keeps
# one pending run per group); a cancelled run publishes nothing.
concurrency:
  group: deploy-myk9show
  cancel-in-progress: false

jobs:
  preflight:
    name: Pick a green main commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.pick.outputs.commit_sha }}
      action: ${{ steps.live.outputs.action }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate the commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          bash scripts/qa/pick-deploy-commit.sh

      # MYK9-2240: refuse a commit that does not contain what production serves
      # (a pin can be behind another session's newer deploy), and skip the build
      # when production already serves it. Checked again right before publish.
      - name: Refuse a rollback of what production serves
        id: live
        env:
          COMMIT_SHA: ${{ steps.pick.outputs.commit_sha }}
          REBUILD_LIVE: ${{ inputs.rebuild_live }}
        run: bash scripts/qa/deploy-live-guard.sh

      # MYK9-1527: refuse a frontend that would ship ahead of its schema. Checks
      # the exact commit picked above, so a migration merged after any local
      # check cannot slip through. `supabase db push` stays owner-only.
      - uses: actions/setup-node@v7
        if: steps.live.outputs.action == 'deploy'
        with:
          node-version: '22.23.4'

      - name: Refuse a commit with unapplied migrations
        if: steps.live.outputs.action == 'deploy'
        env:
          COMMIT_SHA: ${{ steps.pick.outputs.commit_sha }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/qa/deploy-migration-guard.ts

  deploy:
    name: Build and deploy to Vercel production
    needs: preflight
    # Runs on "nothing to deploy" too: the build and publish steps skip, and
    # the verify step at the end proves production is consistent (MYK9-2240).
    if: needs.preflight.outputs.action == 'deploy' || needs.preflight.outputs.action == 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://myk9show.com
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@59
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}

      # MYK9-2240: the live-commit guard and the verify script come from THIS
      # workflow's revision, not the checked-out deploy commit, which may
      # predate them.
      - name: Load this workflow's deploy guards
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          for script in deploy-live-guard.sh verify-production.sh vercel-env-placeholder-guard.ts; do
            git show "FETCH_HEAD:scripts/qa/$script" >"$RUNNER_TEMP/$script"
          done

      - uses: pnpm/action-setup@v6
        if: needs.preflight.outputs.action == 'deploy'
        with:
          run_install: false

      - uses: actions/setup-node@v7
        if: needs.preflight.outputs.action == 'deploy'
        with:
          node-version: '22.23.4'

      - name: Pull production project settings and env
        if: needs.preflight.outputs.action == 'deploy'
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

      # MYK9-1699: `vercel pull` writes the literal [SENSITIVE] for any env var
      # marked Sensitive, and the build bakes it into the bundle. Fail before
      # building. No VITE_* variable is exempt: browser values must be Config
      # (non-sensitive) variables in Vercel. The guard still honours a
      # SENSITIVE_PLACEHOLDER_ALLOWLIST env (comma-separated keys, warn-only)
      # for a deliberate, dated exception.
      - name: Refuse a pulled env with [SENSITIVE] placeholders
        if: needs.preflight.outputs.action == 'deploy'
        # Load the guard from THIS workflow's revision, not the checked-out
        # deploy commit: a rollback to a commit that predates the guard must
        # still be checked (and must not fail for lack of the script).
        # (copied to $RUNNER_TEMP by "Load this workflow's deploy guards").
        run: |
          set -euo pipefail
          node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            "$RUNNER_TEMP/vercel-env-placeholder-guard.ts" .vercel/.env.production.local

      - name: Build
        if: needs.preflight.outputs.action == 'deploy'
        run: pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      # MYK9-896: stamp the built output with the commit it was built from, so
      # the verify step can prove production serves THIS commit.
      - name: Stamp the build with its commit
        if: needs.preflight.outputs.action == 'deploy'
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$COMMIT_SHA" ]]
          printf '%s\n' "$COMMIT_SHA" >.vercel/output/static/build-sha.txt

      # MYK9-2240: the last read of what production serves before publishing,
      # with main's full history so the ancestry check can see the live commit.
      # On a re-run of this job alone it may now find the commit already live
      # and skip the publish; the verify step below still runs.
      - name: Refuse a rollback of what production serves
        id: live
        if: needs.preflight.outputs.action == 'deploy'
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
          REBUILD_LIVE: ${{ inputs.rebuild_live }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            git fetch --no-tags --unshallow origin "+refs/heads/main:refs/remotes/origin/main"
          else
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          fi
          bash "$RUNNER_TEMP/deploy-live-guard.sh"

      - name: Deploy the prebuilt output
        id: deploy
        if: steps.live.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          url="$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "Deployed: $url"

      # MYK9-546: fail the run unless the deployment just published is READY,
      # belongs to this project and owns myk9show.com (the per-deployment URL
      # can sit behind Vercel deployment protection, so the bundle itself is
      # compared through the public hosts in the next step).
      - name: Verify this deployment owns myk9show.com
        if: steps.live.outputs.action == 'deploy'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          ref="${DEPLOYMENT_URL#https://}"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$ref?teamId=$VERCEL_ORG_ID" >deployment.json
          deployment_id="$(node -e '
            const d = JSON.parse(require("node:fs").readFileSync("deployment.json", "utf8"));
            if (d.readyState !== "READY") throw new Error(`deployment is ${d.readyState}, not READY`);
            if (d.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error("deployment belongs to another project");
            process.stdout.write(d.id ?? d.uid);
          ')"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/deployments/$deployment_id/aliases?teamId=$VERCEL_ORG_ID" >aliases.json
          node -e '
            const a = JSON.parse(require("node:fs").readFileSync("aliases.json", "utf8"));
            if (!a.aliases?.some(({ alias }) => alias === "myk9show.com")) {
              throw new Error("this deployment does not own myk9show.com");
            }
          '
          rm -f deployment.json aliases.json
          echo "- Deployment: $DEPLOYMENT_URL (\`$deployment_id\`)" >>"$GITHUB_STEP_SUMMARY"

      # MYK9-2240: the ONE check that production is consistent, run on every
      # path (published now, already live per preflight, or already live when
      # this job was re-run alone): both hosts' `/` serve the same entry chunk
      # and both report this commit. No `if:` on purpose.
      - name: Verify production serves this commit
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: bash "$RUNNER_TEMP/verify-production.sh"
