  #   timeout-minutes: 15
  #   needs: build
  #   continue-on-error: true
  #
  #   steps:
  #     - uses: actions/checkout@v6
  #
  #     - uses: pnpm/action-setup@v6
  #
  #     - uses: actions/setup-node@v6
  #       with:
  #         node-version: '20'
  #         cache: 'pnpm'
  #
  #     - name: Install dependencies
  #       run: pnpm install --frozen-lockfile
