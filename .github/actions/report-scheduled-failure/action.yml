name: Report scheduled failure
description: >-
  Keep exactly one GitHub issue per scheduled workflow reflecting whether that
  workflow is currently broken. Opens it on the first failure, comments on
  repeats, and closes it when the workflow goes green again.

inputs:
  workflow-name:
    description: Human name of the workflow, used in the issue title.
    required: true
  outcome:
    description: >-
      The job result to report. Callers pass the job-status expression from the
      WORKFLOW, where the job context exists. Anything other than "success"
      counts as broken. Do not write that expression literally here: GitHub
      evaluates expressions inside a manifest's description, and the job context
      does not exist inside a composite action, so the interpolation braces alone
      make the whole action fail to load.
    required: true
  token:
    description: Token with issues:write on this repository.
    required: true
  extra:
    description: Optional markdown appended to the issue body or comment.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Reconcile the tracking issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
        OUTCOME: ${{ inputs.outcome }}
        EXTRA: ${{ inputs.extra }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPO: ${{ github.repository }}
      run: |
        # `set -e` deliberately: this step must go RED if it cannot report.
        # A notifier that fails quietly reproduces the exact defect it exists
        # to fix -- a signal produced and then dropped.
        set -euo pipefail

        TITLE="CI: ${WORKFLOW_NAME} is failing"
        LABEL="ci-failure"

        # The label must exist before it can be used as a filter.
        gh label create "$LABEL" --repo "$REPO" \
          --description "A scheduled workflow is currently red" --color B60205 2>/dev/null || true

        # Match on the exact title rather than relevance ranking, which is
        # fuzzy and would happily return a different workflow's issue.
        #
        # Sorted ascending and ALL matches captured, not just the first. The
        # lookup and the create below are not atomic, so two overlapping runs
        # could each see nothing and each open an issue. Each wired workflow
        # carries a concurrency group to prevent that, but a belt-and-braces
        # collapse costs one line and makes the invariant self-healing: the
        # lowest-numbered issue always wins, and any duplicate is closed on the
        # next run rather than lingering as the noise this action exists to
        # avoid.
        MATCHES="$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
          --json number,title --limit 100 \
          --jq "[.[] | select(.title == \"${TITLE}\") | .number] | sort | .[]")"

        # Split MATCHES with a here-string, never a pipe.
        #
        # MYK9-578, and scoped honestly: this is a LATENT bug fix, not the
        # cause of that incident. The old lookup piped MATCHES to `head -n 1`,
        # which under `set -o pipefail` exits 141 if the reader leaves while
        # the writer still has bytes to push -- but only for a payload larger
        # than a pipe buffer, and `--limit 100` caps MATCHES near 800 bytes.
        # Replayed 1000 times at the incident's payload size: 0 failures.
        #
        # Removed anyway, because a pipeline that can only fail at a size this
        # call cannot reach today is one `--limit` change away from reachable.
        # A here-string is a temp file, not a pipe: no reader to race and no
        # pipeline status to inherit.
        #
        # Two behaviour changes come with it, both deliberate. The array keeps
        # the final entry, which the old `while read` dropped without its
        # trailing-newline guard. And a leading blank line used to make
        # EXISTING empty -- which closed every number as a duplicate of
        # nothing -- where now the first non-empty entry wins. `IFS= read`
        # preserves surrounding spaces rather than trimming them.
        NUMBERS=()
        while IFS= read -r line; do
          if [ -n "$line" ]; then NUMBERS+=("$line"); fi
        done <<< "$MATCHES"

        EXISTING=""
        if [ ${#NUMBERS[@]} -gt 0 ]; then EXISTING="${NUMBERS[0]}"; fi

        # Collapse any duplicate a past race left behind.
        if [ ${#NUMBERS[@]} -gt 1 ]; then
          for dup in "${NUMBERS[@]:1}"; do
            gh issue close "$dup" --repo "$REPO" \
              --comment "Duplicate of #${EXISTING}, which tracks this workflow."
            echo "Closed duplicate #${dup}."
          done
        fi

        if [ "$OUTCOME" = "success" ]; then
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" \
              --body "Green again as of [this run](${RUN_URL}). Closing."
            gh issue close "$EXISTING" --repo "$REPO"
            echo "Closed #${EXISTING} — ${WORKFLOW_NAME} recovered."
          else
            echo "${WORKFLOW_NAME} is green and no issue is open. Nothing to do."
          fi
          exit 0
        fi

        BODY="$(printf '%s\n' \
          "**${WORKFLOW_NAME}** failed." \
          "" \
          "Latest failing run: ${RUN_URL}" \
          "" \
          "${EXTRA}" \
          "" \
          "---" \
          "" \
          "This issue is opened and closed automatically by the workflow itself." \
          "While it is open, that workflow is red. It closes on the next green run," \
          "so it needs no manual triage to stay accurate." \
          "" \
          "It exists because a scheduled workflow's result is only visible to someone" \
          "who opens the Actions tab. Playwright Regression was red for four consecutive" \
          "weeks before anyone noticed, which is how a broken spec reached four PRs.")"

        if [ -n "$EXISTING" ]; then
          # EDIT, never comment. A repeat failure is not news — the open issue
          # already says the workflow is broken. Support Triage runs every 15
          # minutes, so commenting per failure would post ~96 notifications a
          # day and train the reader to mute the one channel that matters.
          # Refreshing the body keeps the newest run link current and silent.
          gh issue edit "$EXISTING" --repo "$REPO" --body "$BODY"
          echo "Refreshed #${EXISTING} — ${WORKFLOW_NAME} still red."
        else
          gh issue create --repo "$REPO" --title "$TITLE" --label "$LABEL" --body "$BODY"
          echo "Opened a new issue — ${WORKFLOW_NAME} newly red."
        fi
