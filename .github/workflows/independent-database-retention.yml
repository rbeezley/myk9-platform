# Daily cleanup is independent of the hourly export concurrency group.
name: Independent Database Retention

on:
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch: {}

concurrency:
  group: independent-database-retention
  cancel-in-progress: false

jobs:
  retention:
    name: Apply daily backup retention
    if: vars.MYK9_RETENTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify AWS client
        run: aws --version
      - name: Validate approved retention destination
        run: |
          if [ "$BACKUP_BUCKET" != 'myk9-database-backups' ] || [ "$BACKUP_PREFIX" != 'myk9-platform' ]; then
            echo 'Retention approval no longer matches export configuration. Pause MYK9_RETENTION_ENABLED and review the new destination before changing this guard and its deletion confirmation.' >&2
            exit 1
          fi
        env:
          BACKUP_BUCKET: ${{ vars.MYK9_EXPORT_BUCKET }}
          BACKUP_PREFIX: ${{ vars.MYK9_EXPORT_PREFIX }}
      - name: Verify latest export freshness
        run: pnpm exec tsx scripts/backup/verify.ts
        env:
          BACKUP_PROJECT_REF: sojmvhhwsjxmfistvzbe
          BACKUP_BUCKET: ${{ vars.MYK9_EXPORT_BUCKET }}
          BACKUP_PREFIX: ${{ vars.MYK9_EXPORT_PREFIX }}
          BACKUP_S3_ENDPOINT: ${{ vars.MYK9_EXPORT_S3_ENDPOINT }}
          BACKUP_GRACE_MINUTES: '30'
          BACKUP_TIME_ZONE: ${{ vars.MYK9_EXPORT_TIME_ZONE }}
          BACKUP_WEEKEND_DAYS: ${{ vars.MYK9_EXPORT_WEEKEND_DAYS }}
          BACKUP_NIGHTLY_HOUR: ${{ vars.MYK9_EXPORT_NIGHTLY_HOUR }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MYK9_EXPORT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MYK9_EXPORT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.MYK9_EXPORT_REGION }}
      - name: Apply approved retention after verification
        run: pnpm exec tsx scripts/backup/retention.ts
        env:
          BACKUP_PROJECT_REF: sojmvhhwsjxmfistvzbe
          BACKUP_BUCKET: ${{ vars.MYK9_EXPORT_BUCKET }}
          BACKUP_PREFIX: ${{ vars.MYK9_EXPORT_PREFIX }}
          BACKUP_S3_ENDPOINT: ${{ vars.MYK9_EXPORT_S3_ENDPOINT }}
          BACKUP_RETENTION_DAYS: '30'
          BACKUP_RETENTION_APPLY: ${{ github.event_name == 'schedule' && vars.MYK9_RETENTION_ENABLED == 'true' }}
          BACKUP_RETENTION_CONFIRM: DELETE myk9-database-backups/myk9-platform
          AWS_ACCESS_KEY_ID: ${{ secrets.MYK9_EXPORT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MYK9_EXPORT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.MYK9_EXPORT_REGION }}
      - name: Report scheduled failure
        if: always()
        uses: ./.github/actions/report-scheduled-failure
        with:
          workflow-name: Independent Database Retention
          outcome: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          extra: 'Backup cleanup failed. Inspect the freshness or retention failure before retrying cleanup; hourly exports run independently.'
