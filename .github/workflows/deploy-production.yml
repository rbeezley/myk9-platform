name: Deploy Production

# CI-gated production deploys for myK9Show and the guides site.
#
# Vercel's Git integration must be set NOT to auto-deploy the production branch
# (set git.deploymentEnabled.main=false in apps/myk9show/vercel.json — NOT an
# Ignored Build Step, which would also abort this workflow's own CLI deploy; see
# docs/operations/ci-vercel-deploys.md). This workflow is then the sole path
# that ships `main` to production for both Vercel projects — and only AFTER the entire CI workflow
# (Quality Checks + Test + Build, plus A11y smoke + E2E PR Smoke when runtime
# paths changed) passes on the merged commit. Before this, every push to `main`
# deployed to production regardless of whether tests passed.
#
# It triggers on the *completion* of the "CI" workflow rather than on `push`
# directly, so it can gate on CI's overall conclusion. It deploys the exact
# commit CI validated (head_sha), not the branch tip.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

# Never run two production deploys at once; let an in-flight deploy finish
# rather than cancelling it mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy myK9Show to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only when CI SUCCEEDED on a push to main (post-merge). Skips PR runs,
    # failed/cancelled CI runs, and any non-main branch.
    #
    # The PRODUCTION_DEPLOY_ENABLED repo variable is the enable gate: until an
    # operator sets it to 'true' (AFTER adding the VERCEL_* secrets), this job is
    # SKIPPED — so the workflow is genuinely inert on merge and never runs
    # `vercel deploy` with empty secrets (which would fail the run, not no-op).
    # See docs/operations/ci-vercel-deploys.md.
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the commit CI actually validated, not whatever the branch tip
          # has drifted to since the CI run started.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Remote build: Vercel builds using the project's own settings (Root
      # Directory apps/myk9show, the turbo buildCommand in vercel.json, and the
      # dashboard env vars) — identical to the previous Git auto-deploy, only the
      # trigger changed. Run from the repo root so the whole monorepo is uploaded
      # and the project's Root Directory resolves correctly.
      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "Deployed: $url"
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >>"$GITHUB_STEP_SUMMARY"

  deploy-docs:
    name: Deploy guides to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Keep the guides project on the same post-merge CI gate as myK9Show.
    # The separate project ID lets both projects share the Vercel org and token
    # without accidentally deploying the app project twice.
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: production-docs
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the same commit that CI validated for the app deployment.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Run from the repository root so the docs project's Root Directory
      # (apps/docs) can still read docs/user-guides during its build.
      - name: Deploy guides to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "Deployed: $url"
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Guides production deploy"
            echo ""
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >>"$GITHUB_STEP_SUMMARY"
