# Nightly Health — deterministic logic checks plus read-only route health.
#
# MYK9-1467: the signed-in route sweeps run against an isolated Supabase stack
# built on the runner, as nightly-e2e.yml does. Signing the fixture accounts into
# production made each run send ~12k requests to the live project (p95 rose to
# 543 ms on 2026-10-28) and failed most nights on the same contention. Production
# keeps one anonymous probe of the public routes on the deployed site, which
# signs nobody in. Neither half exercises entry creation, scoring, ringside
# updates or other write paths.
name: Nightly Health

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

# Serialized, so the tracking-issue reconciliation stays free of a
# lookup/create race between two runs of the whole workflow.
concurrency:
  group: nightly-health
  cancel-in-progress: false

jobs:
  nightly-health:
    name: Read-only QA health
    runs-on: ubuntu-latest
    # Room for the isolated stack: supabase start, every migration and the seeds.
    timeout-minutes: 60
    if: vars.MYK9SHOW_SMOKE_CI_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      # Writes the loopback VITE_SUPABASE_URL / MYK9_E2E_* values into GITHUB_ENV,
      # so every later step (and the dev server Playwright starts) targets this
      # runner's own stack. No E2E_*_EMAIL secrets anywhere in this job: the seed
      # hard-codes the @myk9t.com addresses, so an override could only point at an
      # account it never created (see nightly-e2e.yml).
      - name: Prepare isolated Supabase target
        run: pnpm qa:isolated-e2e:prepare
        env:
          MYK9_PLAYWRIGHT_REGRESSION_ENABLED: 'true'
          MYK9_PLAYWRIGHT_REGRESSION_TARGET: isolated
          MYK9_E2E_APPROVED_PROJECT_REFS: local
          MYK9_E2E_SUPABASE_PROJECT_REF: local
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Verify E2E auth credentials
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/verify-e2e-auth-preflight.ts --check-roles secretary admin judge exhibitor
        env:
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Install Playwright browser
        run: pnpm --filter @myk9/show exec playwright install --with-deps chromium

      # MYK9-1467: boot each edge function the app calls before the sweep, so a page's
      # first call does not pay the start-up inside the 5 s settle window. Prints
      # the first and second answer times; never fails the job.
      - name: Warm the isolated edge functions
        run: bash scripts/qa/warm-isolated-functions.sh

      - name: Run read-only nightly health
        run: pnpm qa:nightly:health
        env:
          CI: 'true'
          # The stack is seeded, so a canary with no qualifying row FAILS instead of
          # skipping (liveCanary.DATA_REQUIRED); a skip would pass having checked nothing.
          MYK9_PLAYWRIGHT_REGRESSION_ENABLED: 'true'
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      # MYK9-1128: fail the job (and so skip the upload below) if a configured secret is
      # still in the artifact, including inside the HTML report's embedded zip. Prints
      # file names and counts only. Trace zips are not uploaded, so they are skipped.
      - name: Verify no secrets in artifacts (route-health report)
        id: verify-artifacts
        if: always()
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/verify-artifact-secrets.ts --skip-zip-files playwright-report
        env:
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Upload route-health report
        if: ${{ always() && steps.verify-artifacts.outcome != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: myk9show-nightly-health-report
          # Never the trace archives: they hold test-account tokens and
          # this repository's artifacts are public (MYK9-1057).
          path: |
            apps/myk9show/playwright-report/
            !apps/myk9show/playwright-report/**/*.zip
          retention-days: 7

      - name: Stop isolated Supabase target
        if: always()
        run: pnpm qa:isolated-e2e:stop

  # Cross-browser route health — WebKit and iOS Safari.
  #
  # Until now every automated Playwright run in this repo installed chromium
  # only, so four of the five projects in playwright.config.ts had never
  # executed. That leaves the configuration most exhibitors are actually on at
  # a show — an iPhone — completely unexercised, and WebKit is where IndexedDB,
  # service workers and storage eviction diverge most from Chromium. The
  # offline-first architecture depends on all three.
  #
  # ADVISORY, NOT BLOCKING (`continue-on-error: true`) for its first runs.
  # A local dry run on 2026-08-23 was clean — all six role groups passed on
  # both projects against staging — so the backlog these projects were expected
  # to surface did not materialise for this spec. Advisory is still the right
  # starting point: one clean local run is not evidence of stability on a
  # hosted runner, and a brand-new browser in CI is where timing-dependent
  # flake shows up. Promote it by deleting `continue-on-error` once a few
  # scheduled runs have been green; the contract test pins the current shape,
  # so promotion is a deliberate two-file edit rather than drift.
  #
  # Runs after the chromium job, on its own isolated stack, so the advisory
  # sweep never competes with the gate for the runner pool. `if: always()` so a
  # red baseline still yields cross-browser data.
  cross-browser-health:
    name: Cross-browser route health (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    needs: nightly-health
    if: always() && vars.MYK9SHOW_SMOKE_CI_ENABLED == 'true'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      - name: Prepare isolated Supabase target
        run: pnpm qa:isolated-e2e:prepare
        env:
          MYK9_PLAYWRIGHT_REGRESSION_ENABLED: 'true'
          MYK9_PLAYWRIGHT_REGRESSION_TARGET: isolated
          MYK9_E2E_APPROVED_PROJECT_REFS: local
          MYK9_E2E_SUPABASE_PROJECT_REF: local
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      # The chromium job's preflight does not cover this one: `if: always()`
      # runs this job even when that job failed for a missing secret, and the
      # route spec `test.skip()`s each role whose credentials are absent — so
      # without its own preflight an advisory run could report green having
      # exercised only public routes.
      - name: Verify E2E auth credentials
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/verify-e2e-auth-preflight.ts --check-roles secretary admin judge exhibitor
        env:
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Install Playwright browser
        run: pnpm --filter @myk9/show exec playwright install --with-deps webkit

      # MYK9-1467: boot each edge function the app calls before the sweep, so a page's
      # first call does not pay the start-up inside the 5 s settle window. Prints
      # the first and second answer times; never fails the job.
      - name: Warm the isolated edge functions
        run: bash scripts/qa/warm-isolated-functions.sh

      - name: Run cross-browser route health
        run: pnpm qa:nightly:health
        env:
          CI: 'true'
          MYK9_PLAYWRIGHT_REGRESSION_ENABLED: 'true'
          # Both projects are WebKit-engine: desktop Safari and iPhone 13.
          MYK9_NIGHTLY_HEALTH_PROJECTS: 'webkit,mobile-safari'
          # The deterministic Vitest block is browser-independent — the
          # chromium job above already ran it.
          MYK9_NIGHTLY_HEALTH_SKIP_VITEST: 'true'
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      # MYK9-1128: fail the job (and so skip the upload below) if a configured secret is
      # still in the artifact, including inside the HTML report's embedded zip. Prints
      # file names and counts only. Trace zips are not uploaded, so they are skipped.
      - name: Verify no secrets in artifacts (cross-browser route-health report)
        id: verify-artifacts
        if: always()
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/verify-artifact-secrets.ts --skip-zip-files playwright-report
        env:
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_JUDGE_PASSWORD: ${{ secrets.E2E_JUDGE_PASSWORD }}
          E2E_DEMO_EXHIBITOR_PASSWORD: ${{ secrets.E2E_DEMO_EXHIBITOR_PASSWORD }}

      - name: Upload cross-browser route-health report
        if: ${{ always() && steps.verify-artifacts.outcome != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: myk9show-cross-browser-health-report
          # Never the trace archives: they hold test-account tokens and
          # this repository's artifacts are public (MYK9-1057).
          path: |
            apps/myk9show/playwright-report/
            !apps/myk9show/playwright-report/**/*.zip
          retention-days: 7

      - name: Stop isolated Supabase target
        if: always()
        run: pnpm qa:isolated-e2e:stop

  # The one check that still touches production: the public route group of the
  # same spec, as an anonymous visitor on the deployed site. It sets no fixture
  # password, so it signs nobody in and costs a handful of anonymous reads; the
  # signed-in groups skip for want of credentials. Blocking: a public page that
  # breaks on myk9show.com is the outage this workflow exists to catch.
  production-probe:
    name: Anonymous production probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.MYK9SHOW_SMOKE_CI_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter='./packages/*' build

      - name: Install Playwright browser
        run: pnpm --filter @myk9/show exec playwright install --with-deps chromium

      - name: Probe the public routes on myk9show.com
        working-directory: apps/myk9show
        run: >-
          pnpm exec playwright test src/test/e2e/route-health-by-role.spec.ts
          --grep "Route health: public" --project=chromium
          --workers=1 --timeout=90000 --retries=0
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: https://myk9show.com

      # MYK9-1128: every Playwright report upload passes this gate. This job holds no
      # secret, so it checks against none; it is here so a secret added later is caught.
      - name: Verify no secrets in artifacts (production probe report)
        id: verify-artifacts
        if: always()
        working-directory: apps/myk9show
        run: pnpm exec tsx scripts/verify-artifact-secrets.ts --skip-zip-files playwright-report

      - name: Upload production probe report
        if: ${{ always() && steps.verify-artifacts.outcome != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: myk9show-production-probe-report
          path: |
            apps/myk9show/playwright-report/
            !apps/myk9show/playwright-report/**/*.zip
          retention-days: 7

  # Reported by its OWN job rather than a step inside one of the jobs above,
  # because `job.status` would describe only that one. cross-browser-health is
  # `continue-on-error` and advisory, so the workflow's real verdict is the
  # chromium baseline plus the production probe — this reports both, and names
  # the advisory result without letting it open an issue on its own.
  report-status:
    name: Report status to the tracking issue
    runs-on: ubuntu-latest
    needs: [nightly-health, cross-browser-health, production-probe]
    if: always() && vars.MYK9SHOW_SMOKE_CI_ENABLED == 'true'
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/report-scheduled-failure
        with:
          workflow-name: Nightly Health
          outcome: ${{ (needs.nightly-health.result == 'success' && needs.production-probe.result == 'success') && 'success' || 'failure' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          extra: >-
            Isolated route health: ${{ needs.nightly-health.result }}. Anonymous
            production probe: ${{ needs.production-probe.result }}. Advisory
            cross-browser sweep: ${{ needs.cross-browser-health.result }}.
