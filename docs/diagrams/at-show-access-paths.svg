<svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg"
     font-family="Helvetica,Arial,sans-serif" font-size="13"
     fill="#1a1a1a" role="img">
  <title>At-Show Access Paths</title>
  <desc>Two paths into the at-show ringside view: account holders sign in and tap Ringside; guests enter a show passcode or scan a QR code. Both paths lead to the class list.</desc>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#6b6560"/>
    </marker>
  </defs>

  <!-- Edges drawn first (behind nodes) -->

  <!-- START → DECISION -->
  <line x1="300" y1="69" x2="300" y2="96" stroke="#6b6560" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DECISION YES (left 175,145) → left step top -->
  <polyline points="175,145 145,145 145,247" stroke="#6b6560" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- DECISION NO (right 425,145) → right step top -->
  <polyline points="425,145 455,145 455,247" stroke="#6b6560" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Left step bottom → END oval left edge -->
  <polyline points="145,303 145,400 230,400" stroke="#6b6560" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Right step bottom → END oval right edge -->
  <polyline points="455,303 455,400 370,400" stroke="#6b6560" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- START oval -->
  <ellipse cx="300" cy="45" rx="95" ry="24" fill="#eaf3ec" stroke="#2e7d5a" stroke-width="1.5"/>
  <text x="300" y="50" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Open myK9Show</text>

  <!-- DECISION diamond -->
  <polygon points="300,97 425,145 300,193 175,145" fill="#fdf3da" stroke="#b7791f" stroke-width="1.5"/>
  <text x="300" y="138" text-anchor="middle" fill="#1a1a1a">Have a myK9Show</text>
  <text x="300" y="156" text-anchor="middle" fill="#1a1a1a">account?</text>

  <!-- Branch labels -->
  <text x="170" y="137" text-anchor="end" font-size="11" fill="#6b6560">Yes</text>
  <text x="430" y="137" text-anchor="start" font-size="11" fill="#6b6560">No</text>

  <!-- LEFT step: signed-in path -->
  <rect x="50" y="247" width="190" height="56" rx="8" fill="#fdf5ef" stroke="#a8472d" stroke-width="1.5"/>
  <text x="145" y="269" text-anchor="middle" fill="#1a1a1a">Sign in and tap</text>
  <text x="145" y="288" text-anchor="middle" fill="#1a1a1a">Ringside in the sidebar</text>

  <!-- RIGHT step: passcode path -->
  <rect x="360" y="247" width="190" height="56" rx="8" fill="#fdf5ef" stroke="#a8472d" stroke-width="1.5"/>
  <text x="455" y="269" text-anchor="middle" fill="#1a1a1a">Enter show passcode</text>
  <text x="455" y="288" text-anchor="middle" fill="#1a1a1a">or scan the QR code</text>

  <!-- END oval -->
  <ellipse cx="300" cy="400" rx="70" ry="24" fill="#eaf3ec" stroke="#2e7d5a" stroke-width="1.5"/>
  <text x="300" y="405" text-anchor="middle" font-weight="bold" fill="#1a1a1a">You're in</text>
</svg>
