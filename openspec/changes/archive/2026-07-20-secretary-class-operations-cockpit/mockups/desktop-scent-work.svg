<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Secretary Show Desk desktop mockup for scent work</title>
  <desc id="desc">A stable daily class schedule, three-item attention strip, and focused class operations panel using named search areas.</desc>
  <defs>
    <style>
      .bg{fill:#f6f3ed}.surface{fill:#fff}.nav{fill:#153e3b}.ink{fill:#18312f}.muted{fill:#647571}.line{stroke:#dce4df;stroke-width:1}.accent{fill:#d96f4a}.accentSoft{fill:#fbe7dd}.mint{fill:#e1f0e9}.mintInk{fill:#27634f}.amber{fill:#fff0cf}.amberInk{fill:#805e1b}.rose{fill:#fde7e2}.roseInk{fill:#9b4339}.sky{fill:#e6f0f7}.skyInk{fill:#355f7b}.chip{fill:#edf2ef}.white{fill:#fff}.shadow{filter:url(#shadow)}
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}.t14{font-size:14px}.t16{font-size:16px}.t18{font-size:18px}.t22{font-size:22px}.t28{font-size:28px}.medium{font-weight:600}.bold{font-weight:700}.caps{font-size:11px;font-weight:700;letter-spacing:1.2px}.round{rx:12}.smallround{rx:8}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#143e3b" flood-opacity=".08"/></filter>
  </defs>
