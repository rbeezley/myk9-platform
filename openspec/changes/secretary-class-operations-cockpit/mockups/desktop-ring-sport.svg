<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Secretary Show Desk numbered-ring sport variation</title>
  <desc id="desc">The same stable schedule cockpit used for an obedience trial, with ring numbers shown only as class metadata.</desc>
