version: 2

# Weekly grouped updates so the Security tab doesn't flood with one PR per
# advisory. Minor + patch versions are bundled per ecosystem; majors land as
# their own PRs (each major bump deserves a dedicated review cycle).
#
# Schedule: Monday 06:00 UTC = early Monday US for triage at start of week.
# See docs/plan-dependabot-remediation.md for the policy this codifies.
#
# Browser-level CI coverage (MYK9-520): ci.yml's smoke-build / A11y smoke /
# E2E PR Smoke jobs skip by default when `github.actor == 'dependabot[bot]'`,
# because GitHub withholds repository secrets from Dependabot-triggered
# `pull_request` runs. ALL THREE jobs are affected -- smoke-build itself
# reads VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY, and a11y / e2e-myk9show
# additionally need real E2E_* login credentials.
#
# PREREQUISITE, before the label below does anything real: a maintainer must
# register VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY and every E2E_* secret
# these jobs use under this repository's Dependabot secrets scope (Settings
# -> Secrets and variables -> Dependabot) -- a separate, one-time action
# outside any single PR, not done by this change. Without it, `pull_request`
# runs triggered by Dependabot still don't get repository secrets even once
# the actor skip is overridden: each job now runs an early
# "Verify Dependabot-run secrets are available" step that fails loudly and
# names the missing secrets in that case, rather than smoke-build silently
# building against an EMPTY VITE_SUPABASE_URL/ANON_KEY and going GREEN on a
# meaningless bundle while a11y/e2e-myk9show fail against it with a
# confusing "Missing required env" message.
#
# Once that prerequisite is done, a maintainer reviewing a bump that touches
# runtime `dependencies` (not just `devDependencies`) should add the
# `run-smoke` label to the PR before merging -- it overrides the actor skip
# so the three jobs run instead of silently SKIPping. That label does not
# exist in this repository yet and nothing here creates it (`labels:` below
# is deliberately unchanged) -- a maintainer must create it by hand first.
# Until BOTH the label exists and the secrets above are registered, treat
# this mechanism as inert for Dependabot PRs and push a follow-up commit
# (which flips `github.actor` off dependabot) or verify manually before
# merging a dependency bump that needs real browser coverage.
#
# Note on the npm "ignore semver-major" rule below: this suppresses ONLY the
# scheduled / non-security major-version PRs. Dependabot security updates
# bypass `ignore` rules — so a major-version SECURITY fix (e.g. undici 5→6)
# is still filed automatically. Trade-off: routine non-security majors
# (@types/node, future React majors, etc.) won't be proposed here and need
# to be picked up by hand during planned upgrade work. Drop the wildcard
# ignore if periodic visibility into routine majors becomes desirable.

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'fix(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    groups:
      # @supabase/* is the spine of both apps — realtime, auth, postgrest, storage.
      # Keep it OUT of the catch-all group so any minor/patch lands as its own PR
      # with separable CI signal. A 13-minor jump rode through the catch-all on
      # 2026-05-27 (commit e018ed74) and triggered the H1 audit in
      # docs/plan-h1-supabase-audit-2026-05-28.md. Pre-emptively listing the
      # sub-packages so this doesn't need re-editing if pnpm hoists any as direct deps.
      supabase:
        patterns:
          - '@supabase/*'
        update-types:
          - 'minor'
          - 'patch'
      npm-minor-patch:
        patterns:
          - '*'
        exclude-patterns:
          # Root pnpm.overrides pins these direct deps. Keep them out of the
          # catch-all group so Dependabot doesn't produce PRs where manifests
          # move but the lockfile still resolves to the pinned version.
          - '@supabase/*'
          - 'eslint-plugin-react-hooks'
          - 'workbox-build'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 3
    labels:
      - 'ci'
      - 'automated'
    commit-message:
      prefix: 'ci(actions)'
      include: 'scope'
    groups:
      gha-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
