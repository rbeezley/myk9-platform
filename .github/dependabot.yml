version: 2

# Weekly grouped updates so the Security tab doesn't flood with one PR per
# advisory. Minor + patch versions are bundled per ecosystem; majors land as
# their own PRs (each major bump deserves a dedicated review cycle).
#
# Schedule: Monday 06:00 UTC = early Monday US for triage at start of week.
# See docs/plan-dependabot-remediation.md for the policy this codifies.
#
# Browser-level CI coverage (MYK9-520): ci.yml's smoke-build / A11y smoke /
# E2E PR Smoke jobs skip when `github.actor == 'dependabot[bot]'` unless the
# PR carries the `run-smoke` label. The label exists in this repository
# (checked with `gh api repos/rbeezley/myk9-platform/labels/run-smoke` on
# 2026-09-25; Dependabot silently drops a configured label that doesn't
# exist). Both updates below apply that label to
# every PR they open, so every dependency bump gets a real browser-level
# conclusion before merge instead of a silent SKIP. Coverage is deliberately
# NOT narrowed to runtime `dependencies`: a grouped bump mixes both kinds, a
# devDependency (Vite, the Playwright runner, a PostCSS plugin) can change the
# built bundle just as much, and the label is the only signal Dependabot can
# set per ecosystem. Action bumps carry it too: they change the very steps
# that build and drive the app.
#
# Secrets model: this is a `pull_request` run, never `pull_request_target`,
# so it checks out and runs the PR's own code with a read-only GITHUB_TOKEN
# and only the Dependabot-scope secrets (Settings -> Secrets and variables ->
# Dependabot), never the repository's Actions secrets. VITE_SUPABASE_URL,
# VITE_SUPABASE_ANON_KEY and the E2E_* staging logins those jobs need are
# registered there (checked 2026-09-24). If one goes missing, each job's
# "Verify Dependabot-run secrets are available" step fails loudly and names
# it, rather than building against an empty value and going green.
#
# Note on the npm "ignore semver-major" rule below: this suppresses ONLY the
# scheduled / non-security major-version PRs. Dependabot security updates
# bypass `ignore` rules — so a major-version SECURITY fix (e.g. undici 5→6)
# is still filed automatically. Trade-off: routine non-security majors
# (@types/node, future React majors, etc.) won't be proposed here and need
# to be picked up by hand during planned upgrade work. Drop the wildcard
# ignore if periodic visibility into routine majors becomes desirable.

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'automated'
      # Forces browser smoke on every npm bump (MYK9-520, see the header).
      - 'run-smoke'
    commit-message:
      prefix: 'fix(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    groups:
      # @supabase/* is the spine of both apps — realtime, auth, postgrest, storage.
      # Keep it OUT of the catch-all group so any minor/patch lands as its own PR
      # with separable CI signal. A 13-minor jump rode through the catch-all on
      # 2026-05-27 (commit e018ed74) and triggered the H1 audit in
      # docs/plan-h1-supabase-audit-2026-05-28.md. Pre-emptively listing the
      # sub-packages so this doesn't need re-editing if pnpm hoists any as direct deps.
      supabase:
        patterns:
          - '@supabase/*'
        update-types:
          - 'minor'
          - 'patch'
      npm-minor-patch:
        patterns:
          - '*'
        exclude-patterns:
          # Root pnpm.overrides pins these direct deps. Keep them out of the
          # catch-all group so Dependabot doesn't produce PRs where manifests
          # move but the lockfile still resolves to the pinned version.
          - '@supabase/*'
          - 'eslint-plugin-react-hooks'
          - 'workbox-build'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 3
    labels:
      - 'ci'
      - 'automated'
      # Forces browser smoke on every action bump (MYK9-520, see the header).
      - 'run-smoke'
    commit-message:
      prefix: 'ci(actions)'
      include: 'scope'
    groups:
      gha-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
