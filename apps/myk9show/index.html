<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14b8a6" />
    <!-- Google Fonts: Montserrat (body) + Playfair Display (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- DNS prefetch for faster API connections -->
    <link rel="dns-prefetch" href="https://sojmvhhwsjxmfistvzbe.supabase.co" />
    <link rel="preconnect" href="https://sojmvhhwsjxmfistvzbe.supabase.co" crossorigin />
    <title>myK9Show - Dog Show Management Platform</title>
    <meta name="description" content="A comprehensive solution for managing dog shows, events, registrations, and scoring—all in one place." />
    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="myK9Show - Dog Show Management Platform" />
    <meta property="og:description" content="A comprehensive solution for managing dog shows, events, registrations, and scoring—all in one place." />
    <meta property="og:image" content="https://myk9show.com/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="myK9Show - Dog Show Management Platform" />
    <meta name="twitter:description" content="A comprehensive solution for managing dog shows, events, registrations, and scoring—all in one place." />
    <meta name="twitter:image" content="https://myk9show.com/pwa-512x512.png" />
    <link rel="preload" href="/logo.webp" as="image" type="image/webp" />
    <!-- Blocking theme initialization to prevent FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('myK9Q_settings');
          var settings = saved ? JSON.parse(saved) : {};
          // Extract from Zustand persist structure
          if (settings.state && settings.state.settings) settings = settings.state.settings;
          else if (settings.settings) settings = settings.settings;

          // Apply theme
          var theme = settings.theme || 'auto';
          var isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(isDark ? 'theme-dark' : 'theme-light');
          if (isDark) document.documentElement.classList.add('dark');

          // Apply accent color (v2: data-accent attribute; silently migrate v1 names)
          var accentMigration = { green: 'grove', blue: 'dusk', purple: 'heather', terracotta: 'clay', orange: 'clay' };
          var accent = settings.accentColor || 'clay';
          accent = accentMigration[accent] || accent;
          document.documentElement.setAttribute('data-accent', accent);

          // Update meta theme-color
          var accentColors = { clay: '#c96442', grove: '#2f8a7f', dusk: '#3d6d8c', heather: '#7b5aa6' };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', accentColors[accent] || '#c96442');
        } catch (e) {
          document.documentElement.classList.add('theme-light', 'accent-green');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
