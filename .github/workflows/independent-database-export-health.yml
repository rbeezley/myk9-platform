name: Independent Database Export Health

on:
  schedule:
    - cron: '22 * * * *' # independent freshness check, UTC
  workflow_dispatch: {}

concurrency:
  group: independent-database-export-health
  cancel-in-progress: false

jobs:
  verify:
    name: Verify latest export freshness
    if: vars.MYK9_EXPORTS_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL and AWS clients
        uses: ./.github/actions/setup-backup-clients
      - name: Select weekend daytime show window
        id: window
        run: |
          set -euo pipefail
          decision="$(pnpm exec tsx scripts/backup/weekend-window.ts)"
          echo "$decision"
          case "$decision" in
            run) echo 'should_run=true' >> "$GITHUB_OUTPUT" ;;
            skip:*) echo 'should_run=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "invalid weekend-window decision: $decision" >&2; exit 1 ;;
          esac
        env:
          BACKUP_DATABASE_URL: postgresql://postgres.sojmvhhwsjxmfistvzbe@aws-1-us-east-2.pooler.supabase.com:5432/postgres
          BACKUP_DATABASE_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_TIME_ZONE: ${{ vars.MYK9_EXPORT_TIME_ZONE }}
          BACKUP_WEEKEND_DAYS: ${{ vars.MYK9_EXPORT_WEEKEND_DAYS }}
          BACKUP_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify latest payloads and freshness
        id: freshness
        if: steps.window.outputs.should_run == 'true'
        run: pnpm exec tsx scripts/backup/verify.ts
        env:
          BACKUP_PROJECT_REF: sojmvhhwsjxmfistvzbe
          BACKUP_BUCKET: ${{ vars.MYK9_EXPORT_BUCKET }}
          BACKUP_PREFIX: ${{ vars.MYK9_EXPORT_PREFIX }}
          BACKUP_S3_ENDPOINT: ${{ vars.MYK9_EXPORT_S3_ENDPOINT }}
          BACKUP_GRACE_MINUTES: '30'
          BACKUP_TIME_ZONE: ${{ vars.MYK9_EXPORT_TIME_ZONE }}
          BACKUP_WEEKEND_DAYS: ${{ vars.MYK9_EXPORT_WEEKEND_DAYS }}
          BACKUP_NIGHTLY_HOUR: ${{ vars.MYK9_EXPORT_NIGHTLY_HOUR }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MYK9_EXPORT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MYK9_EXPORT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.MYK9_EXPORT_REGION }}
      - name: Catch up missed export slot
        if: failure() && steps.freshness.outcome == 'failure' && steps.window.outputs.should_run == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run independent-database-exports.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo 'Dispatched a forced export to recover the missed or invalid backup slot.'
      - name: Report scheduled failure
        if: always() && (steps.window.outcome == 'failure' || steps.window.outputs.should_run == 'true')
        uses: ./.github/actions/report-scheduled-failure
        with:
          workflow-name: Independent Database Export Health
          outcome: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          extra: 'Independent freshness verification failed; a GitHub outage can still hide both export and verification jobs.'
