<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- CRITICAL: Inline styles to prevent white flash - must be FIRST -->
  <style>
    /* Hardcoded backgrounds - no dependencies on external CSS */
    /* EXCEPTION: Landing and Login pages have their own dark theme */
    /* Values MUST mirror v2 canvas tokens in packages/ui/src/styles/{tokens-v2,dark-v2}.css
       to prevent an FOUC flash of v1 colors on first paint. */
    html, body, #root, .page-loader-container {
      background-color: #faf7f2;
    }
    .theme-dark,
    .theme-dark body,
    .theme-dark #root,
    .theme-dark .page-loader-container {
      background-color: #181411;
    }
    /* Landing/Login pages - force dark backgrounds (override warm theme) */
    /* .landing-theme is set by theme-init.js for instant dark background */
    /* IMPORTANT: Only target main containers, NOT nested ones (to preserve gradient effects) */
    .landing-theme,
    .landing-theme body,
    .landing-theme #root {
      background-color: #09090b !important;
    }
    body:has(.landing-page),
    body:has(.landing-page) #root,
    body:has(.login-container),
    body:has(.login-container) #root {
      background-color: #09090b !important;
    }
    /* Only target the main landing-page element, let child containers be transparent */
    .landing-page,
    .login-container,
    .login-background {
      background-color: #09090b !important;
    }
  </style>
  <link rel="icon" type="image/png" href="/myK9Q-teal-96.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="description" content="Professional dog show ring scoring application" />
  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="myK9Q - Queue & Qualify" />
  <meta property="og:description" content="Professional dog show ring scoring application" />
  <meta property="og:image" content="https://myk9q.com/myK9Q-teal-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="myK9Q - Queue & Qualify" />
  <meta name="twitter:description" content="Professional dog show ring scoring application" />
  <meta name="twitter:image" content="https://myk9q.com/myK9Q-teal-512.png" />
  <!-- Theme color for browser chrome - use teal in both modes to help notification text color -->
  <meta name="theme-color" content="#14b8a6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14b8a6" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="myK9Q" />
  <!-- DNS prefetch for faster API connections -->
  <link rel="dns-prefetch" href="https://sojmvhhwsjxmfistvzbe.supabase.co" />
  <link rel="preconnect" href="https://sojmvhhwsjxmfistvzbe.supabase.co" crossorigin />
  <link rel="apple-touch-icon" href="/myK9Q-teal-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>myK9Q - Queue & Qualify</title>

  <!-- Self-hosted Montserrat font (eliminates render-blocking Google Fonts request) -->
  <link rel="stylesheet" href="/fonts/fonts.css" />

  <!-- Fraunces — celebration only (The Podium). Lazy via display=swap; falls back to Georgia. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
    rel="stylesheet"
  />

  <!-- Critical CSS to prevent FOUC -->
  <link rel="stylesheet" href="/critical.css?v=13" />

  <!--
      Blocking Theme Initialization Script
      CRITICAL: Must run BEFORE React to prevent FOUC
      Reads theme from localStorage and applies classes to <html>
    -->
  <script src="/theme-init.js?v=7"></script>
</head>

<body>
  <!-- Background color is set by inline <style> block in <head> -->
  <!-- Landing/Login pages override to dark theme via :has() selectors -->
  <div id="root" style="min-height: 100vh;"></div>
  <!-- PWA update toast renders here (separate from main React app) -->
  <div id="update-toast-root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
