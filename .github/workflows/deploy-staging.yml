name: Deploy Staging

# Successful main CI promotes the exact validated SHA to protected release
# refs. Vercel Git branch tracking performs the staging/guides deployments;
# this automatic workflow never receives a Vercel access token.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write
  actions: read
  deployments: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  promote:
    name: Promote exact SHA to staging release refs
    # `cancelled` is admitted here and then judged by "Evaluate CI gating jobs"
    # below, which looks at the JOBS. The run-level conclusion is an AND over
    # every job including `Test myK9Show (coverage)` -- a push-only informational
    # report that CI's concurrency group cancels whenever merges land close
    # together. Gating on the conclusion alone stranded three consecutive green
    # merges on 2026-09-04 (f7876cd6a, 68a0bd813, ad060903c) with the release
    # refs pinned to 6d7a2db9a.
    #
    # `failure` and `timed_out` are still refused outright -- admitting
    # `cancelled` is not the same as trusting it, and a genuinely superseded run
    # has gating jobs cancelled mid-flight, which the evaluator blocks.
    if: >-
      vars.STAGING_RELEASE_ENABLED == 'true' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Judge the run by its jobs, not by its rollup conclusion. The rule and the
      # reasoning live in the script, which is exercised against recorded real
      # runs by scripts/qa/evaluate-gating-jobs.test.ts.
      - name: Evaluate CI gating jobs
        id: gating
        run: |
          set -uo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" \
            | scripts/ci/evaluate-gating-jobs.sh; then
            echo "promotable=true" >>"$GITHUB_OUTPUT"
          else
            status=$?
            echo "promotable=false" >>"$GITHUB_OUTPUT"
            echo "CI run $CI_RUN_ID is not promotable (evaluator exit $status); leaving the release refs where they are."
          fi

      - name: Skip superseded CI candidates
        id: candidate
        if: steps.gating.outputs.promotable == 'true'
        run: |
          set -euo pipefail
          # Compare against the newest main push CI run of ANY status, not the
          # newest SUCCESSFUL one. Under the job-level rule above a promotable
          # run's conclusion may legitimately be `cancelled`, so a
          # `--status success` filter would skip the very runs this change
          # exists to promote. Whichever run is newest gets its own turn at this
          # workflow, so nothing is lost by deferring to it.
          latest_sha="$(gh run list --workflow CI --branch main --event push --limit 1 --json headSha --jq '.[0].headSha')"
          if [[ "$latest_sha" != "$TARGET_SHA" ]]; then
            echo "Superseded by newer main CI run for SHA $latest_sha"
            echo "should_promote=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_promote=true" >>"$GITHUB_OUTPUT"

      - name: Advance the protected release refs
        id: promote
        if: steps.candidate.outputs.should_promote == 'true'
        run: |
          set -euo pipefail
          promoted_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          app_ref_sha="$(git ls-remote --heads origin refs/heads/staging-release | cut -f1)"
          guides_ref_sha="$(git ls-remote --heads origin refs/heads/guides-release | cut -f1)"
          app_require_fresh=true
          guides_require_fresh=true
          [[ "$app_ref_sha" == "$TARGET_SHA" ]] && app_require_fresh=false
          [[ "$guides_ref_sha" == "$TARGET_SHA" ]] && guides_require_fresh=false
          {
            echo "promoted_at=$promoted_at"
            echo "app_require_fresh=$app_require_fresh"
            echo "guides_require_fresh=$guides_require_fresh"
          } >>"$GITHUB_OUTPUT"
          git push --atomic --force origin \
            "$TARGET_SHA:refs/heads/staging-release" \
            "$TARGET_SHA:refs/heads/guides-release"

      - name: Wait for READY staging and guides deployments
        id: readiness
        if: steps.candidate.outputs.should_promote == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          PROMOTED_AT: ${{ steps.promote.outputs.promoted_at }}
          APP_REQUIRE_FRESH: ${{ steps.promote.outputs.app_require_fresh }}
          GUIDES_REQUIRE_FRESH: ${{ steps.promote.outputs.guides_require_fresh }}
        run: |
          set -euo pipefail

          wait_for_ready_deployment() {
            local environment="$1"
            local release_ref="$2"
            local domain="$3"
            local label="$4"
            local require_fresh="$5"

            for attempt in {1..60}; do
              deployments="$(gh api --method GET "repos/$REPOSITORY/deployments" \
                -f sha="$TARGET_SHA" \
                -f environment="$environment" \
                -f per_page=20 2>/dev/null || echo '[]')"
              deployment_id="$(jq -r \
                --arg sha "$TARGET_SHA" \
                --arg environment "$environment" \
                --arg releaseRef "$release_ref" \
                --arg promotedAt "$PROMOTED_AT" \
                --arg requireFresh "$require_fresh" \
                '[.[] | select(
                  .creator.login == "vercel[bot]" and
                  .sha == $sha and
                  .environment == $environment and
                  (.ref == $sha or .ref == $releaseRef) and
                  ($requireFresh == "false" or .created_at >= $promotedAt)
                )] | first | .id // empty' <<<"$deployments")"
              if [[ -n "$deployment_id" && "$deployment_id" != "null" ]]; then
                statuses="$(gh api \
                  "repos/$REPOSITORY/deployments/$deployment_id/statuses?per_page=20" \
                  2>/dev/null || echo '[]')"
                state="$(jq -r 'first | select(.creator.login == "vercel[bot]") | .state // empty' <<<"$statuses")"
                description="$(jq -r 'first | .description // empty' <<<"$statuses")"
                outcome=''
                case "$state" in
                  success)
                    outcome='READY'
                    ;;
                  inactive)
                    if [[ "$description" == "Skipped - Not affected"* ]]; then
                      outcome='SKIPPED_UNAFFECTED'
                    else
                      echo "$label deployment became inactive: $description" >&2
                      return 1
                    fi
                    ;;
                  error|failure)
                    echo "$label deployment $deployment_id ended in $state" >&2
                    return 1
                    ;;
                esac
                if [[ -n "$outcome" ]]; then
                    environment_url="$(jq -r 'first | .environment_url // empty' <<<"$statuses")"
                    [[ "$environment_url" == https://*.vercel.app ]] || {
                      echo "$label deployment is missing an immutable Vercel environment URL" >&2
                      return 1
                    }
                    curl --fail --silent --show-error --head "$environment_url" >/dev/null
                    curl --fail --silent --show-error --head "https://$domain" >/dev/null
                    echo "${label}_deployment_id=$deployment_id" >>"$GITHUB_OUTPUT"
                    echo "${label}_deployment_url=$environment_url" >>"$GITHUB_OUTPUT"
                    echo "$label deployment $deployment_id is $outcome at $environment_url; verified https://$domain"
                    return 0
                fi
              fi
              echo "Waiting for $label deployment (attempt $attempt/60)..."
              sleep 10
            done

            echo "Timed out waiting for $label deployment to become READY" >&2
            return 1
          }

          wait_for_ready_deployment \
            'Staging – myk9-platform-myk9show' \
            staging-release \
            staging.myk9show.com \
            app \
            "$APP_REQUIRE_FRESH"
          wait_for_ready_deployment \
            'Production – myk9-platform-myk9show-guides' \
            guides-release \
            help.myk9show.com \
            guides \
            "$GUIDES_REQUIRE_FRESH"

      - name: Summary
        if: steps.candidate.outputs.should_promote == 'true'
        run: |
          {
            echo "### Staging release promotion"
            echo ""
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Refs: \`staging-release\`, \`guides-release\`"
            echo "- App deployment: \`${{ steps.readiness.outputs.app_deployment_id }}\` (${{ steps.readiness.outputs.app_deployment_url }})"
            echo "- Guides deployment: \`${{ steps.readiness.outputs.guides_deployment_id }}\` (${{ steps.readiness.outputs.guides_deployment_url }})"
            echo "- Verified domains: \`staging.myk9show.com\`, \`help.myk9show.com\`"
          } >>"$GITHUB_STEP_SUMMARY"
